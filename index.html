<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAVEA DAY — El Juego</title>
<style>
  :root{
    --bg:#0d0b14; --card:#1a1626; --card2:#241e33; --border:#3a3152;
    --gold:#f5c542; --red:#e8524a; --green:#5dd39e; --blue:#5aa9e6; --purple:#b088f9;
    --text:#efeaf7; --muted:#9a8fb8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Georgia,'Times New Roman',serif;
    min-height:100vh; display:flex; justify-content:center;
    background-image:radial-gradient(ellipse at 50% -20%, #2a1f45 0%, var(--bg) 60%);
  }
  #app{width:100%; max-width:760px; padding:16px 14px 60px;}
  header{text-align:center; padding:18px 0 8px;}
  h1{
    font-size:clamp(2rem,7vw,3.2rem); letter-spacing:3px; color:var(--gold);
    text-shadow:0 0 24px rgba(245,197,66,.35); font-weight:900;
  }
  .subtitle{color:var(--muted); font-style:italic; margin-top:4px; font-size:.95rem;}
  /* HUD */
  #hud{
    display:none; position:sticky; top:0; z-index:10;
    background:rgba(13,11,20,.96); backdrop-filter:blur(6px);
    border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin:10px 0 14px;
  }
  #phasebar{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
    font-family:Verdana,sans-serif; font-size:.72rem; color:var(--muted); letter-spacing:1px;}
  #phasename{color:var(--gold); font-weight:bold; text-transform:uppercase;}
  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:6px 14px;}
  @media(min-width:560px){.stats{grid-template-columns:repeat(3,1fr);}}
  .stat{font-family:Verdana,sans-serif; font-size:.7rem;}
  .stat .lbl{display:flex; justify-content:space-between; margin-bottom:2px; color:var(--muted);}
  .bar{height:8px; background:#141020; border-radius:99px; overflow:hidden; border:1px solid #2c2544;}
  .bar i{display:block; height:100%; border-radius:99px; transition:width .5s ease, background .5s;}
  /* scene */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:22px 20px; margin-bottom:14px; animation:pop .35s ease;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  @keyframes pop{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
  .who{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .who .avatar{font-size:2rem; filter:drop-shadow(0 0 8px rgba(176,136,249,.4));}
  .who .name{font-family:Verdana,sans-serif; font-size:.8rem; color:var(--purple); letter-spacing:1px; text-transform:uppercase; font-weight:bold;}
  .scene-text{font-size:1.06rem; line-height:1.65; white-space:pre-line;}
  .result-text{font-size:1.02rem; line-height:1.6; white-space:pre-line; border-left:3px solid var(--gold); padding-left:14px; margin-top:6px;}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  button.choice, button.next{
    font-family:Georgia,serif; font-size:1rem; text-align:left;
    background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:13px 16px; cursor:pointer; transition:all .15s;
    line-height:1.4;
  }
  button.choice:hover, button.next:hover{border-color:var(--gold); background:#2d2542; transform:translateX(4px);}
  button.next{text-align:center; border-color:var(--gold); color:var(--gold); font-weight:bold;}
  .fx{font-family:Verdana,sans-serif; font-size:.72rem; margin-top:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px;}
  .fx span{background:#141020; border:1px solid var(--border); padding:3px 9px; border-radius:99px;}
  .fx .up{color:var(--green);} .fx .down{color:var(--red);}
  .phase-title{
    text-align:center; padding:26px 10px;
  }
  .phase-title .clock{font-family:Verdana,sans-serif; font-size:.8rem; color:var(--muted); letter-spacing:2px;}
  .phase-title h2{color:var(--gold); font-size:1.7rem; margin:8px 0; letter-spacing:1px;}
  .phase-title p{color:var(--muted); font-style:italic;}
  .ending h2{color:var(--gold); font-size:1.5rem; margin-bottom:12px; text-align:center;}
  .ending .medal{font-size:3.5rem; text-align:center; margin-bottom:10px;}
  .roll-note{font-family:Verdana,sans-serif; font-size:.72rem; color:var(--blue); margin-top:10px; letter-spacing:.5px;}
  #intro .roster{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; margin:16px 0;}
  #intro .r{background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:.85rem; line-height:1.4;}
  #intro .r b{color:var(--gold);}
  .small{color:var(--muted); font-size:.8rem; font-style:italic; margin-top:14px;}
  footer{text-align:center; color:#544a72; font-size:.7rem; font-family:Verdana,sans-serif; margin-top:30px; letter-spacing:1px;}

  /* ===== LOGIN ===== */
  #loginBox{text-align:center; padding:10px 4px;}
  #loginBox .userchip{display:flex; align-items:center; gap:10px; justify-content:center; margin:14px 0;
    font-family:Verdana,sans-serif; font-size:.85rem; color:var(--muted);}
  #loginBox .userchip img{width:34px; height:34px; border-radius:99px; border:2px solid var(--gold);}
  .btn-google{
    display:inline-flex; align-items:center; gap:10px; background:#fff; color:#1a1626;
    font-family:Verdana,sans-serif; font-weight:bold; font-size:.9rem;
    border:none; border-radius:10px; padding:12px 22px; cursor:pointer; margin:8px 4px;
  }
  .btn-google:hover{background:#f0f0f0;}
  .btn-guest{
    display:inline-block; background:transparent; color:var(--muted); border:1px solid var(--border);
    font-family:Verdana,sans-serif; font-size:.8rem; border-radius:10px; padding:10px 18px;
    cursor:pointer; margin:8px 4px;
  }
  .btn-guest:hover{color:var(--text); border-color:var(--muted);}
  .login-warn{font-family:Verdana,sans-serif; font-size:.72rem; color:var(--red); margin-top:10px;}
  .login-note{font-family:Verdana,sans-serif; font-size:.72rem; color:var(--muted); margin-top:14px; line-height:1.5;}

  /* ===== RANKING ===== */
  .ranking{margin-top:22px; border-top:1px solid var(--border); padding-top:16px;}
  .ranking h3{color:var(--gold); font-size:1rem; text-align:center; margin-bottom:12px; letter-spacing:1px;
    font-family:Verdana,sans-serif;}
  .ranking table{width:100%; border-collapse:collapse; font-family:Verdana,sans-serif; font-size:.78rem;}
  .ranking td{padding:7px 6px; border-bottom:1px solid var(--card2);}
  .ranking td:first-child{width:32px; color:var(--muted);}
  .ranking td:last-child{text-align:right; color:var(--gold); font-weight:bold;}
  .ranking tr.me{background:rgba(245,197,66,.12); border-radius:8px;}
  .ranking .rk-user{display:flex; align-items:center; gap:8px;}
  .ranking .rk-user img{width:22px; height:22px; border-radius:99px;}
  .ranking .loading{text-align:center; color:var(--muted); font-family:Verdana,sans-serif; font-size:.8rem; padding:10px;}
  .ranking .yourank{text-align:center; font-family:Verdana,sans-serif; font-size:.75rem; color:var(--muted); margin-top:10px;}
  .ranking .yourank b{color:var(--gold);}
  .ranking td.pos{text-align:center; font-size:.85rem;}
  .ranking .rk-user span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* variante para la pantalla de inicio: va arriba del todo, sin línea superior */
  .ranking.top{margin:0 0 20px; border-top:none; border-bottom:1px solid var(--border);
    padding-top:0; padding-bottom:16px;}

  /* ===== CHAVEADEX: encuentro salvaje ===== */
  .enc{text-align:center; padding:30px 10px;}
  .enc .enc-pre{font-family:Verdana,sans-serif; font-size:.72rem; color:var(--muted); letter-spacing:3px;}
  .enc .enc-avatar{font-size:5.5rem; margin:18px 0 10px; display:inline-block;
    filter:brightness(0) drop-shadow(0 0 18px rgba(176,136,249,.55));
    animation:encReveal 1.8s ease forwards;}
  @keyframes encReveal{
    0%{filter:brightness(0) drop-shadow(0 0 18px rgba(176,136,249,.55)); transform:scale(.55);}
    45%{filter:brightness(0) drop-shadow(0 0 18px rgba(176,136,249,.55)); transform:scale(1.08);}
    60%{transform:scale(1);}
    100%{filter:none; transform:scale(1);}
  }
  .enc h2{color:var(--gold); font-size:1.3rem; letter-spacing:1px; margin:6px 0; animation:pop .4s ease .9s backwards;}
  .enc .enc-tier{display:inline-block; font-family:Verdana,sans-serif; font-size:.68rem; letter-spacing:2px;
    border:1px solid currentColor; border-radius:99px; padding:3px 12px; margin-top:8px;}
  .enc .enc-new{margin:16px auto 0; display:inline-block; font-family:Verdana,sans-serif; font-weight:bold;
    font-size:.8rem; color:var(--gold); border:2px dashed var(--gold); border-radius:10px; padding:8px 14px;
    transform:rotate(-3deg); animation:pop .4s ease 1.6s backwards;}
  .enc .enc-count{margin-top:14px; font-family:Verdana,sans-serif; font-size:.72rem; color:var(--muted);}

  /* ===== CHAVEADEX: galería ===== */
  .dexhead{text-align:center; margin-bottom:14px;}
  .dexhead h2{color:var(--gold); letter-spacing:2px;}
  .dexhead .dexstats{font-family:Verdana,sans-serif; font-size:.75rem; color:var(--muted); margin-top:6px;}
  .dex-tier-title{font-family:Verdana,sans-serif; font-size:.7rem; letter-spacing:2px; margin:18px 0 8px; font-weight:bold;}
  .dexgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
  .dex-cell{background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center;}
  .dex-cell .dex-num{display:block; font-family:Verdana,sans-serif; font-size:.6rem; color:var(--muted); letter-spacing:1px;}
  .dex-cell .dex-a{font-size:2.2rem; display:block; margin:4px 0;}
  .dex-cell.locked .dex-a{filter:brightness(0) opacity(.9);}
  .dex-cell b{font-size:.85rem;}
  .dex-cell .dex-chip{display:inline-block; font-family:Verdana,sans-serif; font-size:.58rem; letter-spacing:1px;
    border-radius:99px; padding:2px 8px; margin-top:5px; border:1px solid var(--border); color:var(--muted);}
  .dex-cell.reg .dex-chip{color:var(--green); border-color:var(--green);}
  .dex-cell.visto .dex-chip{color:var(--gold); border-color:var(--gold);}
  .dex-cell p{font-size:.72rem; color:var(--muted); font-style:italic; line-height:1.45; margin-top:6px;}
  .dex-cell .dex-n{font-family:Verdana,sans-serif; font-size:.6rem; color:var(--muted); margin-top:5px; display:block;}
  .dex-badge{font-family:Verdana,sans-serif; font-size:.72rem; color:var(--gold); margin-top:12px;
    border:1px dashed var(--gold); border-radius:99px; display:inline-block; padding:4px 12px;}
  .dexnews{margin-top:18px; border-top:1px solid var(--border); padding-top:14px; text-align:center;}
  .dexnews h3{color:var(--gold); font-size:.95rem; font-family:Verdana,sans-serif; letter-spacing:1px; margin-bottom:8px;}
  .dexnews div{font-family:Verdana,sans-serif; font-size:.78rem; color:var(--text); padding:3px 0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍷 CHAVEA DAY 🍺</h1>
    <div class="subtitle">Un día al año. Hasta que el cuerpo aguante.</div>
  </header>

  <div id="loginScreen" class="card" style="display:none;"></div>

  <div id="hud">
    <div id="phasebar"><span id="phasename"></span><span id="clock"></span></div>
    <div class="stats">
      <div class="stat"><div class="lbl"><span>🍺 Alcohol</span><span id="v-alc"></span></div><div class="bar"><i id="b-alc"></i></div></div>
      <div class="stat"><div class="lbl"><span>🎩 Dignidad</span><span id="v-dig"></span></div><div class="bar"><i id="b-dig"></i></div></div>
      <div class="stat"><div class="lbl"><span>⚡ Energía</span><span id="v-ene"></span></div><div class="bar"><i id="b-ene"></i></div></div>
      <div class="stat"><div class="lbl"><span>💶 Dinero</span><span id="v-din"></span></div><div class="bar"><i id="b-din"></i></div></div>
      <div class="stat" style="grid-column:1/-1;"><div class="lbl"><span>👑 RESPETO CHAVEA</span><span id="v-resp"></span></div><div class="bar"><i id="b-resp"></i></div></div>
    </div>
  </div>

  <div id="stage"></div>
  <footer>CHAVEA DAY™ · Una vez al año desde tiempos inmemoriales</footer>
</div>

<script type="module">
"use strict";

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, addDoc, serverTimestamp,
  query, orderBy, limit, getDocs, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvS3VzBIHEuuBAUptieNKejiZtcQv9leU",
  authDomain: "chaveaday-6ec62.firebaseapp.com",
  projectId: "chaveaday-6ec62",
  storageBucket: "chaveaday-6ec62.firebasestorage.app",
  messagingSenderId: "627712068172",
  appId: "1:627712068172:web:b447de1aa5708fd92602e9"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
const googleProvider = new GoogleAuthProvider();

const WHITELIST = [
  "carlosmaciaspv@gmail.com","juanjodionisio97@gmail.com","salmeronoliveros@hotmail.com",
  "ehc2197@gmail.com","rafa_97a@hotmail.com","guillermo.gvalde@gmail.com","rgfandres@gmail.com"
];

let currentUser = null;   // usuario de Firebase Auth (siempre necesario para jugar)

function pintarLogin(html){
  $('loginScreen').style.display = 'block';
  $('loginScreen').innerHTML = `<div id="loginBox">${html}</div>`;
}

function mostrarPantallaLogin(errorMsg){
  pintarLogin(`
    <div class="scene-text">Chavea Day guarda las historias del grupo en un sitio privado. Entra con tu cuenta de Google para ver el contenido y que tu Chaveadex, tus medallas y el ranking se guarden de verdad.</div>
    <button class="btn-google" id="btnGoogle">🔵 Entrar con Google</button>
    ${errorMsg?`<div class="login-warn">${errorMsg}</div>`:''}
    <div class="login-note">El acceso está limitado a los chaveas invitados.</div>
  `);
  $('btnGoogle').onclick = entrarConGoogle;
}

async function entrarConGoogle(){
  try{
    const res = await signInWithPopup(auth, googleProvider);
    const email = (res.user.email||"").toLowerCase();
    if(!WHITELIST.includes(email)){
      await signOut(auth);
      mostrarPantallaLogin("Esa cuenta (" + email + ") no está en la lista de chaveas invitados.");
      return;
    }
    // onAuthStateChanged se encarga del resto
  }catch(err){
    mostrarPantallaLogin("No se ha podido iniciar sesión. Inténtalo de nuevo.");
  }
}

async function cargarOcrearPerfil(user){
  const ref = doc(db, "perfiles", user.uid);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    const nuevo = {
      nombre: user.displayName||"Chavea", email: user.email, foto: user.photoURL||"",
      partidas: 0, mejorResp: 0, creado: serverTimestamp(), actualizado: serverTimestamp()
    };
    await setDoc(ref, nuevo);
    return nuevo;
  }
  return snap.data();
}

/* Se llama al terminar cada partida: guarda el día, actualiza el perfil y el ranking */
async function guardarResultadoPartida(finalInfo){
  if(!currentUser) return null;
  try{
    const uid = currentUser.uid;
    // 1) archivar la partida (subcolección "dias")
    await addDoc(collection(db, "perfiles", uid, "dias"), {
      fecha: serverTimestamp(),
      resultado: finalInfo.title,
      resp: Math.round(S.resp), alc: Math.round(S.alc), dig: Math.round(S.dig),
      ene: Math.round(S.ene), din: Math.round(S.din),
      chaveasVistos: vistos, flags: flags, dex: dexGame
    });
    // 2) actualizar el perfil agregado (incluida la Chaveadex acumulada)
    const perfilRef = doc(db, "perfiles", uid);
    const perfilSnap = await getDoc(perfilRef);
    const anterior = perfilSnap.exists() ? perfilSnap.data() : {partidas:0, mejorResp:0};
    const mejorResp = Math.max(anterior.mejorResp||0, Math.round(S.resp));
    const dexTotal = {...miDex};
    for(const id in dexGame){
      const g = dexGame[id], p = dexTotal[id]||{v:0, r:false};
      const entrada = { v:(p.v||0)+(g.v||0), r:!!(p.r||g.r) };
      const variantes = [...new Set([...(p.variantes||[]), ...(g.variantes||[])])];
      if(variantes.length) entrada.variantes = variantes;
      dexTotal[id] = entrada;
    }
    await setDoc(perfilRef, {
      nombre: currentUser.displayName||"Chavea", email: currentUser.email, foto: currentUser.photoURL||"",
      partidas: (anterior.partidas||0) + 1, mejorResp, chaveadex: dexTotal, actualizado: serverTimestamp()
    }, {merge:true});
    // la partida ya está fusionada en el histórico: no contarla dos veces
    miDex = dexTotal; dexGame = {};
    // 3) actualizar el ranking global (una fila por usuario)
    await setDoc(doc(db, "ranking", uid), {
      nombre: currentUser.displayName||"Chavea", foto: currentUser.photoURL||"",
      mejorResp, partidas: (anterior.partidas||0) + 1, actualizado: serverTimestamp()
    }, {merge:true});
    return {mejorResp};
  }catch(err){
    console.error("No se pudo guardar la partida:", err);
    return null;
  }
}

/* Pinta el ranking en cualquier contenedor: se usa en la pantalla de inicio
   (top 5, para que haya pique nada más abrir) y al terminar una partida. */
async function pintarRanking(contenedorId, topN = 5){
  const cont = $(contenedorId);
  if(!cont) return;
  if(!currentUser){
    cont.innerHTML = `<div class="yourank">Entra con Google para aparecer en el ranking de chaveas.</div>`;
    return;
  }
  try{
    const q = query(collection(db,"ranking"), orderBy("mejorResp","desc"), limit(topN));
    const snap = await getDocs(q);
    let filas = '', puesto = 0, dentroDelTop = false;
    snap.forEach(d=>{
      puesto++;
      const r = d.data();
      const esTu = d.id === currentUser.uid;
      if(esTu) dentroDelTop = true;
      const marca = puesto===1?'🥇':puesto===2?'🥈':puesto===3?'🥉':puesto;
      filas += `<tr class="${esTu?'me':''}"><td class="pos">${marca}</td>
        <td class="rk-user">${r.foto?`<img src="${r.foto}" referrerpolicy="no-referrer">`:''}<span>${r.nombre}</span></td>
        <td>👑 ${r.mejorResp}</td></tr>`;
    });
    if(!filas) filas = `<tr><td colspan="3" class="loading">Todavía no hay marcas. Sé el primero.</td></tr>`;

    // Tu mejor marca sale siempre, estés o no en el top
    let tuya = '';
    const misSnap = await getDoc(doc(db,"ranking",currentUser.uid));
    if(misSnap.exists()){
      const m = misSnap.data();
      const partidas = m.partidas||0;
      tuya = `<div class="yourank">Tu mejor marca: <b>👑 ${m.mejorResp}</b> · ${partidas} ${partidas===1?'Chavea Day jugado':'Chavea Days jugados'}${dentroDelTop?'':` · fuera del top ${topN}`}</div>`;
    } else {
      tuya = `<div class="yourank">Todavía no has terminado ningún Chavea Day. Juega uno y entras en el ranking.</div>`;
    }
    cont.innerHTML = `<h3>👑 RANKING DE CHAVEAS</h3><table>${filas}</table>${tuya}`;
  }catch(err){
    cont.innerHTML = `<div class="yourank">No se ha podido cargar el ranking ahora mismo.</div>`;
  }
}

/* Arranca la app: escucha el estado de sesión y decide qué pantalla mostrar */
onAuthStateChanged(auth, async (user)=>{
  if(user){
    const email = (user.email||"").toLowerCase();
    if(!WHITELIST.includes(email)){
      await signOut(auth);
      mostrarPantallaLogin("Esa cuenta no está en la lista de chaveas invitados.");
      return;
    }
    currentUser = user;
    $('loginScreen').style.display = 'none';
    $('stage').innerHTML = `<div class="card"><div class="scene-text" style="text-align:center;">Cargando el Chavea Day…</div></div>`;
    try{
      const perfil = await cargarOcrearPerfil(user);
      await cargarContenidoDelJuego();
      miDex = perfil.chaveadex || {};
      if(!perfil.chaveadex && (perfil.partidas||0) > 0) await reconstruirDexHistorica();
      showIntro();
    }catch(err){
      console.error(err);
      $('stage').innerHTML = `<div class="card"><div class="scene-text">No se ha podido cargar el contenido del juego. Comprueba tu conexión y recarga la página.</div></div>`;
    }
  } else {
    mostrarPantallaLogin();
  }
});

/* ================= ESTADO ================= */
const S = { alc:0, dig:90, ene:105, din:45, resp:10 };
const LIM = { alc:142, dig:100, ene:105, din:250, resp:100 };
/* Multiplicadores de dificultad: el Chavea Day no perdona.
   Se emborracha rápido, se agota rápido, el ridículo pesa y el dinero vuela. */
const DIF = { alcSube:1.15, eneBaja:1.25, digBaja:1.9, dinBaja:2.0, respSube:0.55 };
let phaseIdx = 0, queue = [], sceneIdx = 0, log = [], amigo = null;
/* Banderas: las decisiones de una fase desbloquean escenas legendarias en las
   siguientes. Si no haces lo que hay que hacer, esas escenas no ocurren jamás. */
let flags = {};
/* sustituye la descripción del amigo de Pocho (que nunca tiene nombre) */
function T(s){ return amigo ? s.replace(/\{AD\}/g, amigo.d) : s; }

const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* Cuántas veces ha salido cada uno en esta partida. Sirve para que ningún
   chavea acapare: en cada fase se eligen los que menos han aparecido. */
let vistos = {};
function pickFair(pool, n){
  const elegidas = [];
  // sc.si() = condición de escena (p.ej. una escena de un Alberto solo puede
  // salir si ese Alberto ya ha aparecido antes en la partida)
  // sc.enc  = encuentro por lugar: jamás entra por sorteo (lo inserta checkEncuentros)
  const restantes = shuffle(pool).filter(sc => !sc.enc && (!sc.si || sc.si()));
  // sc.prio = promesa narrativa pendiente (si el juego la ha anunciado, se paga)
  for(let i=restantes.length-1; i>=0 && elegidas.length<n; i--){
    if(restantes[i].prio){
      const sc = restantes.splice(i,1)[0];
      vistos[sc.ch] = (vistos[sc.ch]||0) + 1;
      elegidas.push(sc);
    }
  }
  while(elegidas.length < n && restantes.length){
    // de los que quedan, el mínimo de apariciones acumuladas
    let min = Infinity;
    for(const sc of restantes) min = Math.min(min, vistos[sc.ch]||0);
    const candidatos = restantes.filter(sc => (vistos[sc.ch]||0) === min);
    const sc = candidatos[Math.floor(Math.random()*candidatos.length)];
    restantes.splice(restantes.indexOf(sc), 1);
    vistos[sc.ch] = (vistos[sc.ch]||0) + 1;
    elegidas.push(sc);
  }
  // las promesas pendientes se pagan primero; el resto, en orden aleatorio
  return elegidas.filter(sc=>sc.prio).concat(shuffle(elegidas.filter(sc=>!sc.prio)));
}

let CH = {}, AMIGOS = [], ROSTER = [], PHASES = [];

/* ================= CHAVEADEX: estado =================
   DEX      = catálogo de fichas (viene de escenas/meta en Firestore).
   miDex    = tu histórico (perfiles/<uid>.chaveadex): {id:{v, r, variantes?}}.
   dexGame  = lo visto/registrado en la partida en curso (se fusiona al guardar).
   VISTO (v)      = el personaje ha aparecido en alguna de tus partidas.
   REGISTRADO (r) = has completado su escena legendaria o su condición de captura. */
let DEX = [], DEXBYID = {}, CH2DEX = {};
const TIERS = {
  comun:{n:"LOS 7", c:"var(--green)"}, nocturno:{n:"NOCTURNO", c:"var(--blue)"},
  raro:{n:"RARO", c:"var(--purple)"}, legendario:{n:"LEGENDARIO", c:"var(--gold)"}
};
let miDex = {};
let dexGame = {};
let novedadesDex = [];
let encInsertadas = new Set(), encSplashed = new Set();
/* El contenido narrativo (personajes, amigos de Pocho, y las 68 escenas) ya
   NO vive en este archivo público: se pide a Firestore, y solo lo puede leer
   quien haya iniciado sesión con un correo de la whitelist (ver reglas de
   seguridad). Esto es lo que de verdad protege las historias del grupo. */

function condFn(cond){
  if(!cond) return null;
  if(cond.flag)  return ()=>!!flags[cond.flag];
  if(cond.visto) return ()=>(vistos[cond.visto]||0) > 0;
  return null;
}
function activarCondiciones(sc){
  if(!sc) return;
  if(sc.si)  sc.si  = condFn(sc.si);
  (sc.opts||[]).forEach(o=>{ if(o.req) o.req = condFn(o.req); });
}

async function cargarContenidoDelJuego(){
  const metaSnap = await getDoc(doc(db,"escenas","meta"));
  if(!metaSnap.exists()) throw new Error("Sin contenido en Firestore");
  const meta = metaSnap.data();
  CH = meta.CH; AMIGOS = meta.AMIGOS; ROSTER = meta.roster || [];
  /* Catálogo de la Chaveadex: si aún no está subido, el juego funciona igual
     (sin galería ni splashes), no se rompe nada. */
  DEX = meta.dex || []; DEXBYID = {}; CH2DEX = {};
  DEX.forEach(d=>{
    DEXBYID[d.id] = d;
    // los personajes con clave propia (los 7, Albertos, el amigo) registran
    // avistamiento automático; los "cameo" comparten clave y van por escena.
    if(d.ch && d.ch !== 'cameo') CH2DEX[d.ch] = d.id;
  });
  const fases = [];
  for(const finfo of meta.phases){
    const fSnap = await getDoc(doc(db,"escenas",finfo.id));
    const fd = fSnap.data();
    activarCondiciones(fd.intro);
    activarCondiciones(fd.cruce);
    activarCondiciones(fd.outro);
    (fd.pool||[]).forEach(activarCondiciones);
    fases.push({
      name:finfo.name, clock:finfo.clock, tag:finfo.tag, pick:finfo.pick, drift:finfo.drift||null,
      intro:fd.intro, cruce:fd.cruce||null, outro:fd.outro||null, pool:fd.pool
    });
  }
  PHASES = fases;
}

/* ================= CHAVEADEX: lógica ================= */
function estadoDex(id){
  const p = miDex[id]||{}, g = dexGame[id]||{};
  return {
    v: (p.v||0) + (g.v||0),
    r: !!(p.r || g.r),
    variantes: [...new Set([...(p.variantes||[]), ...(g.variantes||[])])]
  };
}
function marcarVisto(id){
  const d = DEXBYID[id]; if(!d) return null;
  const antes = estadoDex(id);
  const g = dexGame[id] || (dexGame[id] = {v:0, r:false});
  g.v++;
  // el amigo de Pocho tiene 7 formas: apuntamos cuál te ha tocado
  if(id === 'amigo' && amigo){
    const ix = AMIGOS.indexOf(amigo);
    if(ix >= 0 && !antes.variantes.includes(ix)){
      g.variantes = g.variantes || [];
      if(!g.variantes.includes(ix)) g.variantes.push(ix);
    }
  }
  if(antes.v === 0) novedadesDex.push({tipo:'visto', id});
  return { nuevo: antes.v === 0, total: antes.v + 1 };
}
function marcarRegistrado(id){
  const d = DEXBYID[id]; if(!d) return null;
  const antes = estadoDex(id);
  const g = dexGame[id] || (dexGame[id] = {v:0, r:false});
  if(antes.v === 0 && g.v === 0){ g.v = 1; novedadesDex.push({tipo:'visto', id}); }
  if(!antes.r) novedadesDex.push({tipo:'reg', id});
  g.r = true;
  return { nuevo: !antes.r };
}
/* Encuentros por lugar: las escenas enc:true NUNCA salen por sorteo.
   Se insertan en la cola en cuanto su condición (estar en el sitio
   correcto a la hora correcta) se cumple. Como en Pokémon: si no vas
   a la hierba alta, no hay bicho. */
function checkEncuentros(minPos){
  const P = PHASES[phaseIdx]; if(!P) return;
  let at = Math.max(sceneIdx, minPos||0);
  for(const sc of (P.pool||[])){
    if(sc.enc && !encInsertadas.has(sc) && (!sc.si || sc.si())){
      encInsertadas.add(sc);
      queue.splice(at++, 0, sc);
    }
  }
}
function splashEncuentro(sc){
  const d = DEXBYID[sc.dex];
  const res = marcarVisto(sc.dex);
  const t = TIERS[d.tier] || TIERS.raro;
  window._encScene = sc;
  stage(`<div class="enc">
    <div class="enc-pre">✨ ENCUENTRO ✨</div>
    <div class="enc-avatar">${d.a}</div>
    <h2>¡UN ${d.n.toUpperCase()} SALVAJE HA APARECIDO!</h2>
    <div class="enc-tier" style="color:${t.c}">${t.n}</div><br>
    ${res.nuevo
      ? `<div class="enc-new">✨ NUEVO EN LA CHAVEADEX</div>`
      : `<div class="enc-count">Encuentro nº ${res.total} con este personaje</div>`}
    <div class="choices" style="margin-top:22px;"><button class="next" onclick="encContinuar()">▶ ¿Qué hace el aspirante?</button></div>
  </div>`);
}
function encContinuar(){ renderScene(window._encScene); }
/* Primera visita con la Chaveadex activa: reconstruye lo que se pueda
   del histórico de días ya jugados (avistamientos por chavea y Manolo). */
async function reconstruirDexHistorica(){
  try{
    const snap = await getDocs(collection(db,"perfiles",currentUser.uid,"dias"));
    const acc = {};
    snap.forEach(docu=>{
      const dia = docu.data();
      const cv = dia.chaveasVistos||{};
      for(const ch in cv){
        const id = CH2DEX[ch];
        if(id){ const e = acc[id]||(acc[id]={v:0,r:false}); e.v += cv[ch]||0; }
      }
      const fl = dia.flags||{};
      if(fl.manolo){ const e = acc.manolo||(acc.manolo={v:0,r:false}); e.v++; e.r=true; }
    });
    miDex = acc;
    if(Object.keys(acc).length){
      await setDoc(doc(db,"perfiles",currentUser.uid), {chaveadex: acc}, {merge:true});
    }
  }catch(err){ console.warn("No se pudo reconstruir la Chaveadex:", err); }
}
function chaveadex(){
  $('hud').style.display='none';
  if(!DEX.length){
    stage(`<div class="scene-text" style="text-align:center;">📕 La Chaveadex todavía no está disponible: falta subir el catálogo a Firestore.</div>
      <div class="choices"><button class="next" onclick="showIntro()">← Volver</button></div>`);
    return;
  }
  let v=0, r=0;
  DEX.forEach(d=>{ const e=estadoDex(d.id); if(e.v>0)v++; if(e.r)r++; });
  const grupos = [['comun'],['nocturno'],['raro'],['legendario']];
  let cuerpo = '';
  for(const [tier] of grupos){
    const items = DEX.map((d,i)=>({d,i})).filter(x=>x.d.tier===tier);
    if(!items.length) continue;
    const t = TIERS[tier];
    cuerpo += `<div class="dex-tier-title" style="color:${t.c}">${t.n}</div><div class="dexgrid">`;
    for(const {d,i} of items){
      const e = estadoDex(d.id);
      const num = `Nº ${String(i+1).padStart(3,'0')}`;
      const formas = d.id==='amigo' ? ` · Formas: ${e.variantes.length}/${AMIGOS.length||7}` : '';
      if(e.r){
        cuerpo += `<div class="dex-cell reg"><span class="dex-num">${num}</span><span class="dex-a">${d.a}</span>
          <b>${d.n}</b><span class="dex-chip">REGISTRADO ✓</span><p>${d.desc||''}</p>
          <span class="dex-n">Encuentros: ${e.v}${formas}</span></div>`;
      } else if(e.v > 0){
        cuerpo += `<div class="dex-cell visto"><span class="dex-num">${num}</span><span class="dex-a">${d.a}</span>
          <b>${d.n}</b><span class="dex-chip">SIN REGISTRAR</span><p>📍 ${d.captura||'Nadie sabe todavía cómo se registra.'}</p>
          <span class="dex-n">Visto ${e.v} ${e.v===1?'vez':'veces'}${formas}</span></div>`;
      } else {
        cuerpo += `<div class="dex-cell locked"><span class="dex-num">${num}</span><span class="dex-a">${d.a}</span>
          <b>???</b><span class="dex-chip">SIN AVISTAR</span><p>${d.pista||''}</p></div>`;
      }
    }
    cuerpo += `</div>`;
  }
  stage(`<div class="dexhead"><h2>📕 LA CHAVEADEX</h2>
    <div class="dexstats">Vistos ${v}/${DEX.length} · Registrados ${r}/${DEX.length}</div>
    <div class="dexstats" style="font-style:italic;">Hay que verlos a todos. Hay que registrarlos a todos.</div></div>
    ${cuerpo}
    <div class="choices" style="margin-top:20px;"><button class="next" onclick="showIntro()">← Volver al principio</button></div>`);
}


/* ================= HUD ================= */
function clamp(k,v){ return Math.max(0, Math.min(LIM[k], v)); }
function applyFx(fx){
  const parts=[];
  for(const k of ["alc","dig","ene","din","resp"]){
    if(fx && fx[k]){
      let v = fx[k];
      if(k==='resp' && v>0)      v = Math.max(1, Math.round(v*DIF.respSube)); // el respeto se gana caro
      else if(k==='alc' && v>0)  v = Math.round(v*DIF.alcSube);
      else if(k==='ene' && v<0)  v = Math.round(v*DIF.eneBaja);
      else if(k==='dig' && v<0)  v = Math.round(v*DIF.digBaja);
      else if(k==='din' && v<0)  v = Math.round(v*DIF.dinBaja);
      S[k]=clamp(k, S[k]+v);
      const name={alc:"🍺",dig:"🎩",ene:"⚡",din:"💶",resp:"👑"}[k];
      parts.push(`<span class="${v>0?'up':'down'}">${name} ${v>0?'+':''}${v}</span>`);
    }
  }
  updateHUD();
  return parts.length?`<div class="fx">${parts.join('')}</div>`:'';
}
function barColor(k,v){
  if(k==='alc') return v>75?'var(--red)':v>45?'var(--gold)':'var(--green)';
  return v<25?'var(--red)':v<50?'var(--gold)':'var(--green)';
}
function updateHUD(){
  for(const k of ["alc","dig","ene","din","resp"]){
    const pct = Math.round(100*S[k]/LIM[k]);
    $('b-'+k).style.width=pct+'%';
    $('b-'+k).style.background = k==='resp'?'linear-gradient(90deg,var(--purple),var(--gold))':barColor(k,pct);
    $('v-'+k).textContent = k==='din'? S[k]+'€' : Math.round(S[k]);
  }
}

/* ================= MECENAZGO =================
   Quedarse sin pasta no te elimina: siempre hay un chavea que suelta 50 pavos.
   Pero cada rescate se paga en respeto, y el precio sube. */
let rescates = 0;
const MECENAS = [
  {ch:"juanjo", r:"Juanjo te ve palpándote los bolsillos con cara de tragedia y lo entiende antes de que digas nada.\n\nSaca un billete de 50 y te lo mete en el bolsillo de la camisa él mismo, con las dos manos, acompañándolo de un gesto amplio que significa «no se hable más».\n\n«Chavea. Al Chavea Day no se viene a hacer cuentas.»"},
  {ch:"kike", r:"Kike, sin dejar de mirar el móvil, alarga el brazo y te planta 50 euros en la mano.\n\n«Toma.»\n\n«Te lo devuelvo el...»\n\n«Toma.» Y vuelve a lo suyo. Un hombre con tres vehículos no discute de cincuenta euros a estas horas."},
  {ch:"salme", r:"Salme te ve seco y reacciona con la naturalidad de quien resuelve un problema logístico menor.\n\n«¿Sin pasta? Toma 50. Me lo devuelves cuando te apuntes a un curso de foil.»\n\nY lo dice medio en broma... pero saca el móvil y te enseña las tarifas. Nunca deja de trabajar. Nunca."},
  {ch:"guille", r:"Guille se saca del bolsillo un billete de 50 arrugadísimo, lo estira contra la pierna con muchísimo cuidado y te lo entrega como quien entrega un documento importante.\n\n«Esto... esto es PARA TI. Y no me lo devuelvash.» Pausa. «Bueno, sí. Mañana. O nunca.» Otra pausa. «Nunca esh mejor.»"},
  {ch:"turko", r:"El Turko no pregunta. Ve la situación desde la barra, se acerca, te deja 50 euros en la mano y te lo resume con una calada:\n\n«El dinero se acaba, la noche no. Eso ya lo tenías que saber, chavea.»\n\nY vuelve a su sitio antes de que te dé tiempo a darle las gracias."},
  {ch:"fae", r:"Faé se entera de que estás sin blanca y, como todo lo suyo, lo convierte en un acto público:\n\n«¡¡SEÑORES!! ¡¡EL ASPIRANTE ESTÁ TIESO!!»\n\nMonta una colecta en treinta segundos, pasando una gorra imaginaria, y te entrega 50 euros con una ceremonia de entrega de trofeo. Todo el bar aplaude. Tú querrías desaparecer, pero tienes 50 pavos."},
  {ch:"pocho", r:"Pocho aparece a tu lado antes de que te dé tiempo a preocuparte. Ya lo sabía. Lo sabía desde hace media hora.\n\nTe pone 50 euros en la mano cerrándote los dedos encima y te mira muy serio:\n\n«Esto no ha pasado. Y sigue la fiesta.»"}
];
function darMecenazgo(sigue){
  const m = rnd(MECENAS), c = CH[m.ch];
  rescates++;
  S.din = clamp('din', S.din + 50);
  const coste = rescates===1 ? 0 : (rescates===2 ? -4 : -9);
  const extra = rescates===1
    ? "\n\nPrimer rescate de la noche. Aquí nadie se queda fuera por dinero."
    : (rescates===2
      ? "\n\nSegunda vez que te rescatan hoy. Nadie te dice nada, pero el Turko lo ha visto las dos veces."
      : "\n\nY van "+rescates+". Ya no es simpático: es un patrón. «Chavea», comenta Salme en voz alta, «¿tú has traído ALGO de casa?»");
  const fxHtml = coste ? applyFx({resp:coste}) : (updateHUD(),'');
  stage(`<div class="who"><span class="avatar">${c.a}</span><span class="name">${c.n}</span></div>
    <div class="scene-text">💶 <b style="color:var(--gold)">TE HAS QUEDADO SIN PASTA</b>\n\n${m.r}${extra}</div>
    <div class="fx"><span class="up">💶 +50</span></div>${fxHtml}
    <div class="choices"><button class="next" onclick="${sigue}()">Seguir la fiesta →</button></div>`);
}

/* ================= MUERTES ================= */
function checkKO(){
  if(S.alc>=LIM.alc) return {icon:"🚑", title:"K.O. ETÍLICO", text:"El mundo gira. Las luces se funden en una sola. Lo último que recuerdas es a Pocho sujetándote la cabeza con una ternura inesperada mientras Juanjo, veterano en estas lides, te tapa con su chaqueta.\n\nTe despiertas en un sofá desconocido con un zumo, un ibuprofeno y una nota: «Se intentó. Nos vemos el año que viene. — Los Chaveas».\n\nHas caído con honor, pero has caído."};
  if(S.dig<=0) return {icon:"📱", title:"MUERTE POR VERGÜENZA", text:"Ha ocurrido algo tan lamentable que ni los chaveas —expertos mundiales en el ridículo ajeno y propio— pueden mirarte a los ojos.\n\nEl vídeo ya está en el grupo de WhatsApp. Tiene tres respuestas: un «JAJAJAJAJA» de Salme, un audio de 4 minutos de Faé y un escueto «buah» de Kike, que es lo peor de todo.\n\nSerás leyenda, pero no serás chavea."};
  if(S.ene<=0) return {icon:"😴", title:"EL CUERPO NO AGUANTÓ", text:"Te has quedado dormido. Delante de todos. En pleno Chavea Day.\n\nTe despiertas con un bigote pintado con corcho quemado, la firma de todos los presentes en el brazo y 47 fotos tuyas en posturas cada vez más creativas.\n\nLa regla era una: hasta que el cuerpo aguante. El tuyo no aguantó."};
  /* quedarse sin dinero NO es un final: lo resuelve darMecenazgo() */
  return null;
}

/* ================= RENDER ================= */

function dexBtn(){
  if(!DEX.length) return '';

  DEX.forEach(d=>{ const e=estadoDex(d.id); if(e.v>0)v++; if(e.r)r++; });
  return `<button class="choice" onclick="chaveadex()" style="text-align:center;">📕 CHAVEADEX — ${v}/${DEX.length} vistos · ${r}/${DEX.length} registrados</button>`;
}

function startGame(){
  Object.assign(S,{alc:0,dig:90,ene:105,din:45,resp:10});
  rescates = 0;
  amigo = rnd(AMIGOS);
  vistos = {}; flags = {};
  dexGame = {}; novedadesDex = [];
  encInsertadas = new Set(); encSplashed = new Set();
  phaseIdx=0; $('hud').style.display='block'; updateHUD();
  startPhase();
}

function startPhase(){
  const P = PHASES[phaseIdx];
  applyFx(P.drift||null);
  const ko = checkKO(); if(ko) return showEnding(ko);
  // si el desgaste de la fase te ha dejado seco, primero pasa el mecenas
  if(S.din<=0) return darMecenazgo('montarFase');
  montarFase();
}

function montarFase(){
  const P = PHASES[phaseIdx];
  $('phasename').textContent = P.name; $('clock').textContent = P.clock;
  queue = [P.intro, ...(P.cruce?[P.cruce]:[]), ...pickFair(P.pool, P.pick)];
  if(P.outro) queue.push(P.outro);
  sceneIdx = 0;
  // banderas de fases anteriores pueden desbloquear encuentros de esta fase
  // (se insertan después de la intro y la encrucijada, nunca antes)
  checkEncuentros(1 + (P.cruce?1:0));
  stage(`<div class="phase-title"><div class="clock">${P.clock}</div><h2>${P.name}</h2><p>${P.tag}</p></div>
    <div class="choices"><button class="next" onclick="nextScene()">Adelante →</button></div>`);
}

function nextScene(){
  const ko = checkKO(); if(ko) return showEnding(ko);
  if(S.din<=0) return darMecenazgo('nextScene');
  if(sceneIdx >= queue.length){
    phaseIdx++;
    if(phaseIdx >= PHASES.length) return finalJudgement();
    return startPhase();
  }
  renderScene(queue[sceneIdx++]);
}

function renderScene(sc){
  // Encuentro salvaje: los personajes con ficha no-común entran con su
  // pantalla de encuentro estilo Pokémon antes de la escena.
  if(sc.dex && DEXBYID[sc.dex] && DEXBYID[sc.dex].tier !== 'comun' && !encSplashed.has(sc)){
    encSplashed.add(sc);
    return splashEncuentro(sc);
  }
  // avistamiento automático de personajes con clave propia (los 7, Albertos, amigo)
  if(!sc.dex && CH2DEX[sc.ch]) marcarVisto(CH2DEX[sc.ch]);
  // algunas escenas legendarias REGISTRAN al personaje solo con vivirlas
  let dexBadge = '';
  if(sc.dexReg && DEXBYID[sc.dexReg]){
    const r = marcarRegistrado(sc.dexReg);
    if(r && r.nuevo) dexBadge = `<div style="text-align:center;"><span class="dex-badge">📕 ${DEXBYID[sc.dexReg].n} — REGISTRADO EN LA CHAVEADEX</span></div>`;
  }
  const c = CH[sc.ch]||CH.grupo;
  const nombre = c.n;
  let html = `<div class="who"><span class="avatar">${c.a}</span><span class="name">${nombre}</span></div>
    <div class="scene-text">${T(sc.text)}</div>${dexBadge}<div class="choices">`;
  sc.opts.forEach((o,i)=>{
    if(o.req && !o.req(S)) return;
    html += `<button class="choice" onclick="pick(${i})">${T(o.t)}</button>`;
  });
  html += `</div>`;
  window._scene = sc;
  stage(html);
}

function pick(i){
  const sc = window._scene, o = sc.opts[i];
  if(sc.set) sc.set.forEach(f=>flags[f]=true);   // la escena misma marca
  if(o.set)  o.set.forEach(f=>flags[f]=true);    // la decisión marca
  // elegir el sitio correcto puede desbloquear un encuentro AHORA MISMO
  checkEncuentros();
  // algunas decisiones concretas son la "captura" de un personaje
  let dexBadge = '';
  if(o.dexReg && DEXBYID[o.dexReg]){
    const r = marcarRegistrado(o.dexReg);
    if(r && r.nuevo) dexBadge = `<div style="text-align:center;"><span class="dex-badge">📕 ${DEXBYID[o.dexReg].n} — REGISTRADO EN LA CHAVEADEX</span></div>`;
  }
  const c = CH[sc.ch]||CH.grupo;
  let out, rollNote='';
  if(o.roll){
    const statVal = o.roll.stat==='alc' ? Math.max(0, 100 - S.alc*100/LIM.alc) : S[o.roll.stat];
    const dice = Math.floor(Math.random()*100);
    const score = dice + statVal*0.6;
    const ok = score >= o.roll.dc;
    const statName={alc:"sobriedad",dig:"dignidad",ene:"energía",din:"cartera",resp:"respeto"}[o.roll.stat];
    rollNote = `<div class="roll-note">🎲 Tirada de ${statName}: ${ok?'✅ ÉXITO':'❌ FALLO'} (${Math.round(score)} vs ${o.roll.dc})</div>`;
    out = ok ? o.roll.ok : o.roll.ko;
  } else { out = o.out; }
  const fxHtml = applyFx(out.fx);
  const nombre = c.n;
  let html = `<div class="who"><span class="avatar">${c.a}</span><span class="name">${nombre}</span></div>
    <div class="result-text">${T(out.r)}</div>${rollNote}${fxHtml}${dexBadge}
    <div class="choices"><button class="next" onclick="nextScene()">Continuar →</button></div>`;
  stage(html);
}

/* ================= FINALES ================= */
function showEnding(e, conRanking=true){
  $('hud').style.display='none';
  const rankingBlock = conRanking ? `<div class="ranking" id="rankingBox"><div class="loading">Cargando ranking…</div></div>` : '';
  // resumen de la Chaveadex: qué has visto o registrado HOY por primera vez
  let dexBlock = '';
  if(conRanking && novedadesDex.length){
    const regs = new Set(novedadesDex.filter(n=>n.tipo==='reg').map(n=>n.id));
    const lineas = [];
    novedadesDex.forEach(n=>{
      const d = DEXBYID[n.id]; if(!d) return;
      if(n.tipo==='reg') lineas.push(`📕 ${d.a} <b>${d.n}</b> — ¡REGISTRADO!`);
      else if(!regs.has(n.id)) lineas.push(`👁️ ${d.a} <b>${d.n}</b> — visto por primera vez`);
    });
    if(lineas.length) dexBlock = `<div class="dexnews"><h3>📕 NOVEDADES EN TU CHAVEADEX</h3>${lineas.map(l=>`<div>${l}</div>`).join('')}</div>`;
  }
  stage(`<div class="ending"><div class="medal">${e.icon}</div><h2>${e.title}</h2>
    <div class="scene-text">${e.text}</div>
    ${dexBlock}
    ${rankingBlock}
    <div class="choices" style="margin-top:22px;">
      <button class="next" onclick="startGame()">🔁 Otro Chavea Day (revancha)</button>
      ${DEX.length?`<button class="choice" onclick="chaveadex()">📕 Ver la Chaveadex</button>`:''}
      <button class="choice" onclick="showIntro()">← Volver al principio</button>
    </div></div>`);
  if(conRanking){
    guardarResultadoPartida(e).finally(()=>pintarRanking('rankingBox', 5));
  }
}

function finalJudgement(){
  let e;
  if(S.resp>=75) e={icon:"👑", title:"CHAVEA DE PLENO DERECHO", text:
`Amanece. Estáis en los churros. Silencio ceremonial.

Pocho se levanta, alza el último chupito que nadie sabe de dónde ha salido, y mira al resto. Juanjo asiente (y lo acompaña con el gesto de asentir, por si no quedaba claro). El Turko, fresco como una rosa, asiente. Guille te abraza balbuceando algo precioso que nadie entiende. Faé toca la trompeta. Salme lo sube a stories. Kike recibe una llamada, la cuelga: «esto es más importante».

Y entonces De la Puente saca una bolsa de debajo de la silla. Dentro hay una camiseta doblada. LA camiseta: la de fútbol de los chaveas, con su escudo.

«La traíamos por si acaso», dice Pocho. «Casi nunca hace falta sacarla.»

«Chaveas... tenemos uno nuevo.»

Te la pones encima de la ropa sucia de veinte horas de guerra, con la bandera aún colgada en el Green Daila. Has entrado en el grupo. Nos vemos el año que viene. Hasta que el cuerpo aguante.

👑 Respeto final: ${Math.round(S.resp)}/100`};
  else if(S.resp>=50) e={icon:"🥈", title:"APROBADO... CON CONDICIONES", text:
`Amanece en los churros. Los chaveas deliberan en voz baja (bueno, Guille en voz altísima).

Veredicto de Pocho: «Se te ve maneras, chavea. Pero esto no se regala.»

Estás oficialmente invitado al Chavea Day del año que viene, donde te juzgarán de nuevo. Juanjo te da un consejo de despedida: «La próxima vez, no mezcles tanto al principio.» Viniendo del hombre que vomitó unas cortinas en rojo Rioja, es oro puro.

👑 Respeto final: ${Math.round(S.resp)}/100`};
  else e={icon:"🫂", title:"SE TE QUIERE, PERO NO", text:
`Amanece. Has sobrevivido al Chavea Day entero, que no es poco. Pero sobrevivir no es suficiente: hay que ESTAR.

Los chaveas te despiden con cariño y una ronda de abrazos de Guille (dolorosos). Salme resume el veredicto mientras mira el Instagram: «Buen chaval... pero le falta calle.»

Puedes volver a intentarlo. El Chavea Day siempre vuelve. Una vez al año, sin falta. Como los cumpleaños, pero peor para el hígado.

👑 Respeto final: ${Math.round(S.resp)}/100`};
  showEnding(e);
}
