        {t:"Abrazarle y decirle lo que sientes de verdad", out:{r:"Se lo dices: que ha sido el mejor día en años, que le has visto cuidar de todos toda la noche sin que nadie se lo agradezca, que es el que sostiene el grupo. Pocho se queda callado. Traga saliva. «Joder, chavea.» Otro abrazo, más largo.\n\nCuando volvéis dentro no dice nada a nadie, pero a partir de ese momento te presenta como «uno de los nuestros» en vez de como «el aspirante».", fx:{resp:+14, ene:-3}}},
        {t:"Quedarte en silencio a su lado mirando la calle", out:{r:"No dices nada. Os quedáis los dos apoyados en la pared, viendo pasar taxis a las tres de la mañana.\n\nY entonces asoma la otra cara, sin transición y sin una gota de mala intención: «Chavea... cállate un ratito.» — «Si no estoy hablando.» — «Ya. Sigue así.»\n\nY os quedáis otros cinco minutos en silencio, que resultan ser los mejores cinco minutos del día. Algunas cosas del Chavea Day no llevan palabras.", fx:{resp:+12, ene:+5}}},
        {t:"Aprovechar para contarle una historia tuya", out:{r:"Arrancas una anécdota de las tuyas. A la segunda frase, Pocho levanta un dedo, muy tranquilo, sin girarse:\n\n«Chavea... cállate un ratito.»\n\nAhí está la otra cara. Te callas a mitad de palabra. Faé, que lo ha visto desde la puerta: «¡Le ha hecho LA MIRADA! ¡Al chavea le han hecho la mirada!»\n\nLección aprendida: cuando Pocho sale a tomar el aire, o habla él o no habla nadie.", fx:{resp:-7, dig:-3}}}
      ]},
    {ch:"pocho", text:"Tres y media de la mañana y Pocho está EN SU MEJOR MOMENTO.\n\nLe ha subido el asunto y con los suyos eso significa que está a tope: abraza a Juanjo, le canturrea el «pochín pochín pochín» a De la Puente, se ríe de todo, cuenta cosas buenísimas y ha hecho llorar de risa a Faé dos veces en cinco minutos.\n\nPero hay un detalle. Llegáis a la barra, el camarero se acerca... y Pocho se apaga como una bombilla. Mira al suelo. Da un paso atrás.\n\nCon los chaveas está imparable. Con gente de fuera, en este estado, no puede. Ni una palabra. Y un camarero es gente de fuera. El mismo hombre que hace cuatro horas se ganaba a un camarero en tres minutos ahora mismo no es capaz de mirarle a la cara.\n\nTe pone un billete en la mano sin mirarte: «Pide tú.» Y se gira otra vez hacia el grupo, donde ya vuelve a ser el rey.",
      opts:[
        {t:"Pedir las copas... y un vaso de agua para él", out:{r:"Pides la ronda y, sin decir nada, le pones delante un vaso de agua.\n\nPocho lo mira. Y ocurre algo casi religioso: se lo bebe DE UN TRAGO, cerrando los ojos, como un hombre que cruza el desierto y encuentra un pozo. Lo deja en la barra vacío.\n\n«Ufff.» Te agarra la cara con las dos manos. «El AGUA. Chavea. EL AGUA.»\n\nY acto seguido, restaurado, pide un chupito y se lo bebe encima. Porque así funciona esto: el agua no sustituye nada aquí, el agua REPARA para poder seguir. Alberto de la Puente lo ha visto de reojo desde el fondo y ya viene hacia ti con la mano levantada: «¡¡A MÍ OTRO!!»", fx:{resp:+16, din:-15, ene:+12, alc:+6}}},
        {t:"Coger el billete y pedir sin comentar nada", out:{r:"Ni preguntas ni te ríes. Coges el billete, pides las rondas y le pasas la suya. Pocho la coge y sigue a lo suyo, que es hacer que los otros seis se lo pasen bien.\n\nDe aquí al final de la noche pides tú. Y funciona: desde fuera nadie nota nada raro, porque Pocho está brillando con los suyos como nunca.\n\nAl final, sin dejar de hablar con Guille, te busca con la mirada y te hace un gesto minúsculo con la cabeza. Ya está. Nunca lo hablaréis.", fx:{resp:+14, din:-15, ene:-8}}},
        {t:"Ser su intérprete oficial toda la noche", out:{r:"Asumes el cargo entero: tú hablas con los camareros, tú pides los taxis, tú le contestas al segurata. Pocho, liberado de todo trato con el exterior, se dedica exclusivamente a los chaveas y alcanza cotas históricas: monta un brindis, imita a Juanjo gesticulando, saca un chupito de la nada.\n\nEl Turko lo resume mirándoos: «Le has puesto portavoz. Así rinde el doble.»\n\nHas descubierto solo cómo funciona el mediocentro a estas horas: por dentro, todo. Por fuera, nada.", fx:{resp:+13, din:-12}}},
        {t:"Reírte y decirle «Pocho, es un camarero, tío»", out:{r:"Se te escapa la risa y se lo dices en voz alta delante de todos. Pocho te mira MUY fijamente, con una dignidad enorme, y responde:\n\n«Yo con los míos hablo lo que hay que hablar.»\n\nSilencio de un segundo... y la carcajada del grupo entero, incluida la suya, porque es exactamente lo que pasa y todos lo saben. La frase queda para la historia.\n\nPero Faé no lo deja ahí: durante la siguiente media hora anuncia a cada camarero que se cruza que «este señor no habla con extraños». Pocho te lo apuntará en la cuenta.", fx:{resp:+8, din:-15, dig:-4}}}
      ]},
    {ch:"turko", text:"Una de la mañana. La pista está al máximo: Faé en el centro, Guille en fase terminal, Kike zigzagueando entre la gente. Y en el extremo de la barra, solo, con la espalda apoyada y un cigarro sin encender en la mano, está el Turko. Mirando.\n\nNo está aburrido. Está observando el local entero como observa un edificio: los flujos, los cuellos de botella, por dónde entra la gente y por dónde debería salir.\n\nTe ve llegar y, sin dejar de mirar la pista, comenta: «Esta discoteca está mal diseñada, chavea.»",
      opts:[
        {t:"«¿Mal diseñada? Explica.»", out:{r:"Y te lo explica. Diez minutos de análisis arquitectónico impecable a la una de la mañana: la barra estrangula el paso, los baños están en el peor sitio posible, el reservado rompe la circulación. Todo cierto. Todo verificable mirando.\n\nCuando termina, señala a los chaveas con el cigarro: «Y sin embargo mira. Funciona. Porque el sitio lo hace la gente, no el arquitecto.»\n\nEs la mejor frase de la noche y la ha dicho el que menos habla.", fx:{resp:+11}}},
        {t:"Quedarte con él en la barra un rato", out:{r:"Te apoyas a su lado y os quedáis los dos viendo el espectáculo sin participar: Faé subiéndose a algo, Guille abrazando a un desconocido, De la Puente apareciendo de la nada.\n\nEl Turko te pasa el cigarro sin decir nada. «Desde aquí se ve mejor», comenta.\n\nY tiene razón. Diez minutos de recuperación táctica en el mejor asiento del local, en compañía del único que va a llegar entero al amanecer.", fx:{resp:+8, ene:+10}}},
        {t:"Arrastrarle a la pista con los demás", roll:{stat:"ene", dc:75, ok:{r:"Le quitas el cigarro, le coges del brazo y lo metes en el corro. Y ocurre lo que no ocurre nunca: EL TURKO BAILA. Cuatro canciones. Con su sonrisa serena intacta, sin perder el ritmo ni el aliento, como si también esto lo tuviera calculado.\n\nLos chaveas alucinan. Salme lo graba. «Llevo doce años intentándolo», dice Juanjo, gesticulando su propia derrota. «Doce años.»", fx:{resp:+14, ene:-10}}, ko:{r:"Tiras de su brazo y el Turko no se mueve. No se resiste: simplemente NO SE MUEVE, como un pilar de carga. Te mira con infinita paciencia.\n\n«Chavea. Yo entro a la pista cuando quedan cuatro. Ese es mi turno.»\n\nY así será: a las seis de la mañana, cuando ya no quede casi nadie, el Turko bailará. Pero eso no lo verás hasta el final.", fx:{resp:+3, ene:-6}}}}
      ]}
  ]
},
/* ---------- FASE 5: EL AFTER ---------- */
{
  name:"LA VUELTA", clock:"04:30 · Hasta que el cuerpo aguante", pick:3, drift:{alc:+5, ene:-15, din:-10},
  tag:"No hay after. Hay el mismo circuito otra vez, andando, hasta que amanezca.",
  intro:{ch:"grupo", text:"El Green cierra y os escupe a la calle. Recuento de bajas: Kike enviando audios INTELIGIBLES (fenómeno inexplicable a estas horas), Guille en fase cariñosa terminal abrazado a Faé, que aún conserva la trompeta, y el Turko fresco como si fueran las cinco DE LA TARDE.\n\nAlguien insinúa tímidamente la palabra «casa». Y entonces habla el hombre que jamás ha pronunciado esa palabra, ya con los brazos abiertos otra vez:\n\n«¿Casa? Nos volvemos andando a La Casona, que a esta hora seguro que sigue abierto. Y si no, damos la vuelta y vemos.»\n\nY ahí está el secreto que nadie le cuenta a los aspirantes: el after no existe. Nunca ha existido. El after es esto — volver a pie por donde habéis venido, deshacer el circuito de Kike al revés, entrar donde haya luz encendida, y seguir.\n\nDe la Puente ya ha arrancado. «Pochín pochín pochín», canturrea agarrando a Pocho del brazo. Y Pocho, que jamás dice que no, se deja llevar con una copa en cada mano que nadie le ha pedido.\n\nEsta es la frontera. Lo que separa un buen intento de un CHAVEA DAY completo.",
    opts:[
      {t:"«Hasta que el cuerpo aguante. Vamos.»", out:{r:"De la Puente pega un grito que despierta a un barrio entero y te abraza por decimoquinta vez en el día. «¡¡EL CHAVEÍTA SE VIENE!!»\n\nPocho, sin decir nada, te pone en la mano una de las dos copas que llevaba. Estaba destinada a ti desde el principio: él ya sabía que ibas a seguir.\n\nLos supervivientes forman la última columna de marcha. Esto ya no es una fiesta: es una peregrinación a pie.", fx:{resp:+10, ene:-8, alc:+6}}},
      {t:"«¿Volver? Pero si acabamos de salir de ahí.»", out:{r:"«Exacto», dice De la Puente sin el menor complejo, como si eso lo explicara todo. Y en cierto modo lo explica.\n\nEl Turko lo remata desde su nube: «A estas horas no se elige el SITIO, chavea. Se elige SEGUIR.» Es lo más sabio que se ha dicho en toda la noche y lo ha provocado el más sinvergüenza. Faé levanta la trompeta. La democracia ha hablado.", fx:{resp:+4, alc:+6, ene:-5}}}
    ]},
  pool:[
    {ch:"kike", text:"Kike anuncia su retirada: «Yo... me voy yendo.» Señal universal de peligro: son 20 minutos andando hasta su casa y su trayectoria actual, evaluada científicamente, es un zigzag con deriva de babor. Además ha mencionado tres veces que el Land Rover «está aquí al lado», lo cual DEBE ser impedido a toda costa.",
      opts:[
        {t:"Escoltarlo a casa personalmente", out:{r:"Veinte minutos de escolta nocturna en los que Kike alterna silencios, confesiones ininteligibles y UNA llamada entrante (a las cinco de la mañana; el misterio se agranda) que atiende hablando perfectamente otra vez. Lo entregas en su portal. «Ereh... grande», te dice. Vuelves con el grupo y todos conocen ya tu gesta: la escolta puntúa DOBLE porque nadie la pide y todos la valoran.", fx:{resp:+13, ene:-12}}},
        {t:"Confiscarle las llaves del Land Rover primero", out:{r:"Operación delicadísima: separar a un típico tío tío de sus llaves es como desarmar una bomba. Lo consigues mediante el truco más viejo del mundo («déjame ver el llavero, qué chulo») y se las entregas a Pocho, custodio oficial de cosas confiscadas. Kike se va andando, más seguro él y más seguro el mundo. Responsabilidad nivel chavea: demostrada.", fx:{resp:+10, dig:+3}}},
        {t:"Pedirle un taxi y despedirlo con honores", out:{r:"Solución logística limpia: taxi, dirección confirmada dos veces con el taxista (Kike la pronuncia mal las dos), y despedida con honores militares de todo el grupo desde la acera. Cumplidor y eficaz, aunque la leyenda dice que la escolta a pie vale más. Aún así: gesto anotado.", fx:{resp:+6, din:-8}}}
      ]},
    {ch:"amigo", text:"Seis de la mañana. Y ahí sigue el amigo de Pocho, el que hace ocho horas no existía para ninguno de vosotros y cuyo nombre sigue sin saber nadie.\n\nNo solo sigue: está EN EL NÚCLEO. Lleva la trompeta de Faé colgada del cuello. Ha aprendido a decir «pochín pochín pochín». Guille le ha contado su vida. Y ahora se gira hacia ti, el aspirante, y con una confianza absoluta te suelta:\n\n«Chaveíta, ¿tú vienes todos los años?»\n\nSe cree veterano. LLEVA OCHO HORAS. Y lo peor es que, viéndolo, casi le das la razón.",
      opts:[
        {t:"«Es mi primer año. ¿Y tú?»", out:{r:"«Yo también», dice tranquilamente. «Pero yo ya me siento de aquí.»\n\nY tiene razón. La tiene. Miras alrededor y el tío está integrado a un nivel que a ti te ha costado dieciséis horas de guerra. El Turko, que lo ha oído todo, comenta desde su nube: «Los amigos de Pocho entran por la puerta de atrás. Siempre.»\n\nDecides que en vez de envidiarlo vas a aprender de él. Y brindas con él.", fx:{resp:+9, alc:+6}}},
        {t:"«Llevas ocho horas, no te vengas arriba.»", out:{r:"Se ríe sin ofenderse lo más mínimo —los personajes de novela de ficción no se ofenden nunca— y te contesta: «Ocho horas BUENAS.»\n\nFaé, que pasaba por ahí, lo escucha y lo consagra al instante: «¡OCHO HORAS BUENAS! ¡ESO ES!» La frase se corea. Y así, sin querer, has provocado tú la entrada oficial del amigo de Pocho en la mitología del grupo. Pocho te lo agradece con un asentimiento.", fx:{resp:+11, alc:+5}}},
        {t:"Preguntarle a qué se dedica realmente", out:{r:"Craso error de novato: NUNCA se le pregunta a un amigo de Pocho a qué se dedica. La respuesta dura once minutos, incluye tres sectores distintos, un juicio pendiente y una temporada en Andorra, y al terminar sabes menos que al empezar.\n\nPocho, desde detrás, disfrutando: «Te lo dije. Novela de ficción.»", fx:{resp:+4, ene:-6, alc:+5}}}
      ]},
    {ch:"kike", text:"Kike ha decidido, unilateralmente y contra toda evidencia médica, que hay que RECENAR. Son las cinco de la mañana. Nadie más quiere recenar. Nadie. El grupo entero se lo dice.\n\nÉl ya ha pedido: unas bravas de dudosa procedencia y un plato enorme de patatas fritas que nadie va a tocar.\n\nLo que ocurre a continuación era previsible: como nadie le sigue la recena, Kike empieza a lanzar patatas fritas. Al Turko. A Faé. A Pocho. Y entonces se gira hacia ti con una patata entre los dedos y esa sonrisa de doble cara.",
      opts:[
        {t:"Devolvérsela con una brava a la frente", roll:{stat:"ene", dc:65, ok:{r:"Tiro parabólico perfecto. IMPACTO EN LA FRENTE. La Casona entera enmudece medio segundo y luego estalla. Kike se lleva la mano a la cara, incrédulo: «Me ha dado. ME HA DADO.» Se declara la guerra oficial y en tres minutos el suelo es un campo de patatas. Os echan. Merece la pena.", fx:{resp:+13, ene:-8, din:-8}}, ko:{r:"Fallas por medio metro y le das a un señor que dormitaba en la barra. El señor se despierta, mira la brava, la coge, y se la come. Kike lo señala llorando de risa. La guerra se cancela por absurdo sobrevenido. Sales trasquilado pero con una anécdota que se contará durante años.", fx:{resp:+7, dig:-6, ene:-5}}}},
        {t:"Sentarte y recenar CON él, aunque no te apetezca", out:{r:"Te sientas y coges una patata. Kike se queda parado, con la munición en la mano. «...¿Vas a recenar?» — «Voy a recenar.» Deja las patatas en el plato. Nadie ha recenado con Kike en diecisiete años de Chavea Days. NADIE.\n\nCome en silencio, emocionado, y a mitad del plato te dice: «Eres el primero.» El grupo lo comenta el resto de la noche. Es la mayor conquista social del día.", fx:{resp:+15, ene:+8, din:-10}}},
        {t:"Esquivarla y esconderte detrás del Turko", out:{r:"Usas al Turko de escudo humano, que es el único que aguanta un impacto de patata sin inmutarse ni dejar de fumar. Recibe tres seguidas en el hombro con estoicismo arquitectónico. «Chavea», dice sin girarse, «me estás usando de parapeto.» — «Sí.» — «Vale.» Y sigue fumando. Cero puntos por valentía, cinco por astucia.", fx:{resp:+3, ene:-3}}}
      ]},
    {ch:"juanjo", text:"Juanjo cojea. Nadie sabe de qué, no ha habido naranjos esta vez, pero cojea: es su tradición. Te mira, mira su pierna, te vuelve a mirar, y pronuncia las palabras rituales que una vez pronunció ante Pocho en el campo:\n\n«Chavea... hazme de bastón.»",
      opts:[
        {t:"Ofrecerle el hombro: bastón humano oficial", out:{r:"Asumes el cargo con la solemnidad que merece. Juanjo se apoya y camina a tu lado los ochocientos metros más lentos y más importantes de tu candidatura, contándote entre suspiros la historia COMPLETA del naranjo original, con detalles nuevos que ni Pocho conocía.\n\nAl llegar, sentencia ante todos: «Sabe de bastones. Y el que sabe de bastones... sabe de amistad.» Es el respaldo oficial del miembro de mayor aguante del grupo.", fx:{resp:+12, ene:-10}}},
        {t:"«¿Qué te has hecho ahora, si no hay naranjos?»", out:{r:"«El cuerpo recuerda, chavea», responde con gravedad de oráculo. «Cada Chavea Day, la pierna me avisa. Es mi naranjo fantasma.» Lo acompaña con el gesto exacto de un naranjo, por si acaso.\n\nEs absurdo, es poético y probablemente sea verdad. Le haces de bastón igual, porque a estas alturas ya sabes cómo funciona esto.", fx:{resp:+8, ene:-8}}}
      ]},
    {ch:"guille", text:"Seis menos cuarto de la mañana, andando por la calle. Y ocurre lo que ocurre siempre al final: el cable se DESCRUZA.\n\nGuille, que hace dos horas era una fuerza de la naturaleza, camina ahora a tu lado tranquilo, con las manos en los bolsillos, y de pronto dice, con una lucidez perfecta y sin arrastrar una sola sílaba:\n\n«Qué bien nos lo hemos pasado hoy, ¿no?»\n\nHa vuelto el ingeniero. Analítico, sereno, educado. Como si no hubiera pasado nada. Nunca recuerda casi nada de la parte del medio.",
      opts:[
        {t:"«Muy bien. Y tú has estado espectacular.»", out:{r:"Guille frunce el ceño con auténtica curiosidad científica: «¿Yo? ¿Qué he hecho?»\n\nY se lo cuentas: la columna, el abrazo, la coreografía, la teoría de la servilleta. Lo escucha como quien oye hablar de un desconocido, asintiendo educadamente, y al final concluye:\n\n«Pues suena divertido.» Pausa. «¿Y he sido simpático?» — «Muchísimo.» — «Ah, bueno. Entonces bien.»", fx:{resp:+11}}},
        {t:"Contarle lo del cable y que le llaman el Loko", out:{r:"Se lo explicas con cuidado. Guille lo procesa con la seriedad de un informe técnico y luego pregunta lo más razonable del mundo:\n\n«¿Y por qué nadie me lo dice EN el momento?»\n\n«Porque en el momento no atiendes a razones, Guille.» Se queda pensando. «...Tiene lógica.»\n\nY así, a las seis de la mañana, el Loko acepta un diagnóstico técnico sobre sí mismo con total deportividad. Es entrañable y perfectamente inútil, porque el año que viene pasará igual.", fx:{resp:+9}}},
        {t:"«Nada, tío. No has hecho nada raro.»", out:{r:"Mientes por piedad. Guille asiente satisfecho: «Ya, yo hoy he ido poco a poco.»\n\nY se queda tan tranquilo. El problema es que Salme lo ha oído, y Salme JAMÁS deja pasar una: saca el móvil, busca el vídeo y se lo pone.\n\nGuille mira la pantalla en silencio veinte segundos. «...Ah.» El encubrimiento ha durado exactamente lo que tarda Salme en encontrar un archivo.", fx:{resp:+3}}}
      ]},
    {ch:"turko", text:"Seis y veinte. Quedáis cuatro en pie y uno de ellos es el Turko, que a estas horas ya no es un hombre sino una institución.\n\nEnciende otro, mira a los supervivientes y hace el recuento en voz alta, como un capataz al final del turno: «Kike en casa. Salme desaparecido. Guille recuperado. Faé sin voz. Juanjo cojo. Pocho tocado.»\n\nSe gira hacia ti y añade: «Y el chavea, en pie.» Da una calada. «No está mal, para ser el primer año.»",
      opts:[
        {t:"«¿Y tú, Turko? Tú estás igual que a las dos.»", out:{r:"«Yo apago la luz», responde. Y no es una frase hecha: en veinte años de Chavea Days, el último que se va siempre ha sido él. Es su función y la cumple religiosamente.\n\n«Alguien tiene que quedarse hasta el final para contarlo, chavea. Si no, esto no habría pasado.»\n\nEs el mejor argumento que has oído nunca para no irse a casa.", fx:{resp:+10}}},
        {t:"«Me quedo contigo hasta el final, entonces.»", out:{r:"El Turko no dice nada. Te ofrece el cigarro. Te lo fumas a medias con él viendo cómo amanece detrás de los edificios que probablemente él te podría criticar uno por uno.\n\nY así, sin ceremonia ninguna, quedáis dos apagando la luz en vez de uno.\n\nAl día siguiente, cuando el grupo repase quién aguantó hasta el final, tu nombre aparecerá al lado del suyo. Eso, en este grupo, es un titular.", fx:{resp:+14, ene:-10}}},
        {t:"«Yo creo que ya no puedo más, Turko.»", out:{r:"«Pues te vas», dice sin el menor reproche. «Aguantar por obligación no vale nada.»\n\nY te acompaña él mismo a buscar un taxi, tranquilo, sin prisa, como hace todo. Antes de cerrarte la puerta: «Has hecho un día muy digno, chavea.»\n\nViniendo del hombre que nunca exagera, «digno» es casi una medalla. Pero te has perdido el amanecer, y el amanecer es donde se decide todo.", fx:{resp:+4, ene:+12, din:-10}}}
      ]},
    {ch:"salme", text:"Salme reaparece. Nadie sabe de dónde. Nadie le pregunta, porque son las seis y media de la mañana y ya nadie tiene energía para el expediente Salme.\n\nLlega tan tranquilo, sin explicar nada, y lo primero que hace es sacar el móvil y ponerse a repasar las stories de la noche una por una, comentando la jugada de cada foto como si fuera un análisis post-partido.\n\n«Mira esta. Mira. Aquí ya se te veía tocado, chavea.»\n\nY ahí está su verdadero don: no llevarse a nadie a casa. NARRARLO todo después.",
      opts:[
        {t:"Repasar la noche entera con él, foto por foto", out:{r:"Os sentáis en un bordillo y hacéis la crónica completa: la bandera, la trompeta, el zigzag de Kike, el abrazo de Guille, el ácido de Juanjo. Salme comenta cada momento con precisión de comentarista deportivo.\n\nY entiendes por fin cuál es su papel en el grupo: alguien tiene que ser la MEMORIA. Los demás lo viven; él lo archiva.\n\n«Sin mí no os acordaríais de nada», dice. Y es literalmente cierto.", fx:{resp:+11, ene:-4}}},
        {t:"«Salme. ¿De dónde vienes?»", out:{r:"Levanta la vista del móvil, te mira con absoluta serenidad y responde:\n\n«De por ahí.»\n\nY vuelve al móvil. Fin del interrogatorio. Llevan quince años sacándole exactamente esa misma respuesta y ya lo han aceptado como una constante física del universo.", fx:{resp:+5}}},
        {t:"Pedirle que te mande todas las fotos tuyas", out:{r:"«Hecho», dice, y te las manda ahí mismo. Cuarenta y una fotos y siete vídeos.\n\nLuego añade algo que no esperabas: «Te he ido haciendo fotos toda la noche, chavea. Como a uno más.»\n\nTe quedas con eso. Llevaba dieciséis horas documentándote como si ya fueras del grupo, mucho antes de que nadie hubiera votado nada.", fx:{resp:+12}}}
      ]},
    {ch:"puente", text:"La Casona sigue abierta, como De la Puente había predicho. Dentro, los Albertos y Pocho han formado un triángulo de retroalimentación en la barra. Cada vez que alguien insinúa la retirada, uno de los tres dice «UNA MÁS» y los otros dos lo celebran como si fuera una idea nueva. Llevan así cuarenta minutos. Pocho está más cariñoso que nunca, señal inequívoca de que las «trampas» se han ido gastando. Esto podría no acabar NUNCA.",
      opts:[
        {t:"Sumarte al triángulo: «¡UNA MÁS!»", roll:{stat:"alc", dc:88, ok:{r:"Entras en el triángulo y ABSORBES SU ENERGÍA en lugar de ser absorbido: propones la ronda, la sirves, la brindas, y sigues en pie. Los Albertos te miran como a un igual. Pocho, emocionado y cariñosísimo, te declara «cuadrado» honorífico: el triángulo ahora tiene cuatro lados. La geometría llora. El grupo aplaude.", fx:{resp:+13, alc:+15, ene:-10}}, ko:{r:"El triángulo es una trituradora de aspirantes: a la segunda «UNA MÁS» tu cuerpo emite un comunicado oficial de cierre. Te descubres sentado en un taburete mirando fijamente un cartel de neón durante lo que podrían ser diez minutos o una hora. Alberto de la Puente te reanima con una palmada: «¡El chaval lo ha INTENTADO!» En este grupo, intentarlo puntúa. Sobrevivirlo, más.", fx:{resp:+5, alc:+20, ene:-18, dig:-6}}}},
        {t:"Sabotear el bucle: «Última y nos vamos a por churros»", out:{r:"Pronuncias la única palabra capaz de romper el triángulo: CHURROS. Los tres se detienen a la vez, como si hubieras dicho la contraseña ancestral. «...Churros», repite Alberto de la Puente con la mirada perdida. «CHURROS», confirma Pocho. El bucle colapsa hacia el desayuno. Acabas de salvar vidas y no lo saben.", fx:{resp:+9, alc:+7}}},
        {t:"Traerles tres vasos de agua sin avisar", out:{r:"Vuelves de la barra con tres vasos de agua y los plantas en medio del triángulo.\n\nSilencio. Los tres los miran como si acabaras de traer fuego a la cueva. Y se los beben. DE UN TRAGO. Los tres. Con los ojos cerrados y un «uffff» final al unísono que se oye desde la puerta.\n\n«El agua», dice Alberto de la Puente, tocado por la revelación. «EL AGUA, chaveíta.»\n\nY entonces, restaurados, cada uno pide un chupito y se lo bebe encima. Porque el agua aquí no frena nada: el agua REPARA. Acabas de alargarles la noche dos horas y te lo agradecen como si les hubieras salvado la vida. Que en cierto modo es lo que has hecho.", fx:{resp:+15, din:-10, ene:+10, alc:+8}}},

      {t:"«Ha sido el mejor día de mi vida. Y quiero el del año que viene.»", out:{r:"Los supervivientes cruzan miradas. Guille solloza abiertamente (fase cariñosa terminal). El Turko asiente con el churro. Faé toca una nota larga y solemne de trompeta que el churrero tolera porque a estas horas ya todo da igual.\n\nPocho sonríe despacio. «Buenas palabras. A deliberar.»", fx:{resp:+8}}},

];

/* ================= HUD ================= */
function clamp(k,v){ return Math.max(0, Math.min(LIM[k], v)); }
function applyFx(fx){
  const parts=[];
  for(const k of ["alc","dig","ene","din","resp"]){
    if(fx && fx[k]){
      let v = fx[k];
      if(k==='resp' && v>0) v = Math.max(1, Math.round(v*0.55)); // el respeto se gana caro
      S[k]=clamp(k, S[k]+v);
      const name={alc:"🍺",dig:"🎩",ene:"⚡",din:"💶",resp:"👑"}[k];
      parts.push(`<span class="${v>0?'up':'down'}">${name} ${v>0?'+':''}${v}</span>`);
    }
  }
  updateHUD();
  return parts.length?`<div class="fx">${parts.join('')}</div>`:'';
}
function barColor(k,v){
  if(k==='alc') return v>75?'var(--red)':v>45?'var(--gold)':'var(--green)';
  return v<25?'var(--red)':v<50?'var(--gold)':'var(--green)';
}
function updateHUD(){
  for(const k of ["alc","dig","ene","din","resp"]){
    const pct = Math.round(100*S[k]/LIM[k]);
    $('b-'+k).style.width=pct+'%';
    $('b-'+k).style.background = k==='resp'?'linear-gradient(90deg,var(--purple),var(--gold))':barColor(k,pct);
    $('v-'+k).textContent = k==='din'? S[k]+'€' : Math.round(S[k]);
  }
}

/* ================= MUERTES ================= */
function checkKO(){
  if(S.alc>=LIM.alc) return {icon:"🚑", title:"K.O. ETÍLICO", text:"El mundo gira. Las luces se funden en una sola. Lo último que recuerdas es a Pocho sujetándote la cabeza con una ternura inesperada mientras Juanjo, veterano en estas lides, te tapa con su chaqueta.\n\nTe despiertas en un sofá desconocido con un zumo, un ibuprofeno y una nota: «Se intentó. Nos vemos el año que viene. — Los Chaveas».\n\nHas caído con honor, pero has caído."};
  if(S.dig<=0) return {icon:"📱", title:"MUERTE POR VERGÜENZA", text:"Ha ocurrido algo tan lamentable que ni los chaveas —expertos mundiales en el ridículo ajeno y propio— pueden mirarte a los ojos.\n\nEl vídeo ya está en el grupo de WhatsApp. Tiene tres respuestas: un «JAJAJAJAJA» de Salme, un audio de 4 minutos de Faé y un escueto «buah» de Kike, que es lo peor de todo.\n\nSerás leyenda, pero no serás chavea."};
  if(S.ene<=0) return {icon:"😴", title:"EL CUERPO NO AGUANTÓ", text:"Te has quedado dormido. Delante de todos. En pleno Chavea Day.\n\nTe despiertas con un bigote pintado con corcho quemado, la firma de todos los presentes en el brazo y 47 fotos tuyas en posturas cada vez más creativas.\n\nLa regla era una: hasta que el cuerpo aguante. El tuyo no aguantó."};
  if(S.din<=0) return {icon:"💸", title:"BANCARROTA FESTIVA", text:"Te palpas los bolsillos. Nada. Ni para el bus.\n\nPocho, sin decir palabra, te paga la última copa. Y eso, amigo, es lo peor que te puede pasar: ahora le debes una copa a Pocho, y las deudas con Pocho se pagan en Chavea Days.\n\nTe mandan a casa con dinero prestado para el taxi. Volverás, pero con la lección aprendida: al Chavea Day se viene llorado y con efectivo."};
  return null;
}

/* ================= RENDER ================= */
function stage(html){ $('stage').innerHTML = `<div class="card">${html}</div>`; window.scrollTo({top:0,behavior:'smooth'}); }

function showIntro(){
  $('hud').style.display='none';
  $('stage').innerHTML = `<div class="card" id="intro">
    <div class="scene-text">Hay un día sagrado al año. Comida, vino, cervezas, copas, chupitos y alguna que <i>«otra cosa»</i> más. Empieza a las dos de la tarde y termina cuando el cuerpo dice basta.\n\nSe llama <b style="color:var(--gold)">CHAVEA DAY</b>.\n\nHoy, por primera vez, has sido invitado. No como chavea. Como <b>aspirante</b>. Si al amanecer los chaveas te consideran digno, entrarás en el grupo. Si no... siempre te quedará el recuerdo.\n\nEstos son tus jueces:</div>
    <div class="roster">
      <div class="r">🍬 <b>Juanjo «Golosina»</b> — Aguante de titanio, ácido traicionero. Vomitó las cortinas de una discoteca en rojo Rioja.</div>
      <div class="r">😈 <b>Enrique «Kike» Hernández</b> — Ingeniero del zigzag. Recibe llamadas que nadie sabe de quién son. Tiene Land Rover, moto, barco... siempre para llevar rubias en él.</div>
      <div class="r">⚓ <b>Salme «Perubian»</b> — Capitán de escuela náutica y del Instagram. Una vez se llevó a casa a un grupo de 3 y la ciencia aún lo estudia.</div>
      <div class="r">🔩 <b>Guille «El Loko»</b> — Ingeniero. Analítico. Tranquilo. Hasta que ya no. Y cuando no... LOKURA.</div>
      <div class="r">🌿 <b>El Turko Macías</b> — Arquitecto. Fuma y bebe lo que quiera y siempre va «relativamente bien». Recoge el último.</div>
      <div class="r">🎺 <b>Faé Andrade</b> — Centro de gravedad de toda fiesta. Nos echaron de una discoteca por su culpa. Mereció la pena.</div>
      <div class="r">🎩 <b>Pocho</b> — El mediocentro. Perfil bajo, chupitos altos. Portador oficial de las «trampas».</div>
      <div class="r">🏃🤸 <b>Los Albertos</b> — Refuerzos no confirmados. Si aparecen, la noche cambia de categoría.</div>
    </div>
    <div class="scene-text">Reglas: vigila tu <b>alcohol</b> (si llega al máximo, K.O.), tu <b>dignidad</b> y tu <b>energía</b> (si llegan a cero, fin), y tu <b>dinero</b>. Gana <b style="color:var(--gold)">Respeto Chavea 👑</b> para ser aceptado al amanecer.</div>
    <div class="small">Los eventos son aleatorios: cada partida es un Chavea Day distinto.</div>
    <div class="choices"><button class="next" onclick="startGame()">🍽️ SON LAS 14:00 — EMPIEZA EL CHAVEA DAY</button></div>
  </div>`;
}

function startGame(){
  Object.assign(S,{alc:0,dig:100,ene:100,din:140,resp:10});
  amigo = rnd(AMIGOS);
  vistos = {};
  phaseIdx=0; $('hud').style.display='block'; updateHUD();
  startPhase();
}

function startPhase(){
  const P = PHASES[phaseIdx];
  applyFx(P.drift||null);
  const ko = checkKO(); if(ko) return showEnding(ko);
  $('phasename').textContent = P.name; $('clock').textContent = P.clock;
  queue = [P.intro, ...pickFair(P.pool, P.pick)];
  if(P.outro) queue.push(P.outro);
  sceneIdx = 0;
  stage(`<div class="phase-title"><div class="clock">${P.clock}</div><h2>${P.name}</h2><p>${P.tag}</p></div>
    <div class="choices"><button class="next" onclick="nextScene()">Adelante →</button></div>`);
}

function nextScene(){
  const ko = checkKO(); if(ko) return showEnding(ko);
  if(sceneIdx >= queue.length){
    phaseIdx++;
    if(phaseIdx >= PHASES.length) return finalJudgement();
    return startPhase();
  }
  renderScene(queue[sceneIdx++]);
}

function renderScene(sc){
  const c = CH[sc.ch]||CH.grupo;
  const nombre = c.n;
  let html = `<div class="who"><span class="avatar">${c.a}</span><span class="name">${nombre}</span></div>
    <div class="scene-text">${T(sc.text)}</div><div class="choices">`;
  sc.opts.forEach((o,i)=>{
    if(o.req && !o.req(S)) return;
    html += `<button class="choice" onclick="pick(${i})">${T(o.t)}</button>`;
  });
  html += `</div>`;
  window._scene = sc;
  stage(html);
}

function pick(i){
  const sc = window._scene, o = sc.opts[i];
  const c = CH[sc.ch]||CH.grupo;
  let out, rollNote='';
  if(o.roll){
    const statVal = o.roll.stat==='alc' ? Math.max(0, 100 - S.alc*100/LIM.alc) : S[o.roll.stat];
    const dice = Math.floor(Math.random()*100);
    const score = dice + statVal*0.6;
    const ok = score >= o.roll.dc;
    const statName={alc:"sobriedad",dig:"dignidad",ene:"energía",din:"cartera",resp:"respeto"}[o.roll.stat];
    rollNote = `<div class="roll-note">🎲 Tirada de ${statName}: ${ok?'✅ ÉXITO':'❌ FALLO'} (${Math.round(score)} vs ${o.roll.dc})</div>`;
    out = ok ? o.roll.ok : o.roll.ko;
  } else { out = o.out; }
  const fxHtml = applyFx(out.fx);
  const nombre = c.n;
  let html = `<div class="who"><span class="avatar">${c.a}</span><span class="name">${nombre}</span></div>
    <div class="result-text">${T(out.r)}</div>${rollNote}${fxHtml}
    <div class="choices"><button class="next" onclick="nextScene()">Continuar →</button></div>`;
  stage(html);
}

/* ================= FINALES ================= */
function showEnding(e){
  $('hud').style.display='none';
  stage(`<div class="ending"><div class="medal">${e.icon}</div><h2>${e.title}</h2>
    <div class="scene-text">${e.text}</div>
    <div class="choices" style="margin-top:22px;">
      <button class="next" onclick="startGame()">🔁 Otro Chavea Day (revancha)</button>
      <button class="choice" onclick="showIntro()">← Volver al principio</button>
    </div></div>`);
}

function finalJudgement(){
  let e;
  if(S.resp>=75) e={icon:"👑", title:"CHAVEA DE PLENO DERECHO", text:
`Amanece. Estáis en los churros. Silencio ceremonial.

Pocho se levanta, alza el último chupito que nadie sabe de dónde ha salido, y mira al resto. Juanjo asiente (y lo acompaña con el gesto de asentir, por si no quedaba claro). El Turko, fresco como una rosa, asiente. Guille te abraza balbuceando algo precioso que nadie entiende. Faé toca la trompeta. Salme lo sube a stories. Kike recibe una llamada, la cuelga: «esto es más importante».

Y entonces De la Puente saca una bolsa de debajo de la silla. Dentro hay una camiseta doblada. LA camiseta: la de fútbol de los chaveas, con su escudo.

«La traíamos por si acaso», dice Pocho. «Casi nunca hace falta sacarla.»

«Chaveas... tenemos uno nuevo.»

Te la pones encima de la ropa sucia de veinte horas de guerra, con la bandera aún colgada en el Green Daila. Has entrado en el grupo. Nos vemos el año que viene. Hasta que el cuerpo aguante.

👑 Respeto final: ${Math.round(S.resp)}/100`};
  else if(S.resp>=50) e={icon:"🥈", title:"APROBADO... CON CONDICIONES", text:
`Amanece en los churros. Los chaveas deliberan en voz baja (bueno, Guille en voz altísima).

Veredicto de Pocho: «Se te ve maneras, chavea. Pero esto no se regala.»

Estás oficialmente invitado al Chavea Day del año que viene, donde te juzgarán de nuevo. Juanjo te da un consejo de despedida: «La próxima vez, no mezcles tanto al principio.» Viniendo del hombre que vomitó unas cortinas en rojo Rioja, es oro puro.

👑 Respeto final: ${Math.round(S.resp)}/100`};
  else e={icon:"🫂", title:"SE TE QUIERE, PERO NO", text:
`Amanece. Has sobrevivido al Chavea Day entero, que no es poco. Pero sobrevivir no es suficiente: hay que ESTAR.

Los chaveas te despiden con cariño y una ronda de abrazos de Guille (dolorosos). Salme resume el veredicto mientras mira el Instagram: «Buen chaval... pero le falta calle.»

Puedes volver a intentarlo. El Chavea Day siempre vuelve. Una vez al año, sin falta. Como los cumpleaños, pero peor para el hígado.

👑 Respeto final: ${Math.round(S.resp)}/100`};
  showEnding(e);
}

showIntro();
