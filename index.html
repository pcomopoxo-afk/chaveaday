<style>
  :root{

  *{box-sizing:border-box; margin:0; padding:0;}

  .stat .lbl{display:flex; justify-content:space-between; margin-bottom:2px; color:var(--muted);}
  .bar{height:8px; background:#141020; border-radius:99px; overflow:hidden; border:1px solid #2c2544;}
  .bar i{display:block; height:100%; border-radius:99px; transition:width .5s ease, background .5s;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:22px 20px; margin-bottom:14px; animation:pop .35s ease;

  .who .avatar{font-size:2rem; filter:drop-shadow(0 0 8px rgba(176,136,249,.4));}
  .who .name{font-family:Verdana,sans-serif; font-size:.8rem; color:var(--purple); letter-spacing:1px; text-transform:uppercase; font-weight:bold;}
  .scene-text{font-size:1.06rem; line-height:1.65; white-space:pre-line;}
  .result-text{font-size:1.02rem; line-height:1.6; white-space:pre-line; border-left:3px solid var(--gold); padding-left:14px; margin-top:6px;}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  button.choice, button.next{
    font-family:Georgia,serif; font-size:1rem; text-align:left;
    background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:13px 16px; cursor:pointer; transition:all .15s;

  button.choice:hover, button.next:hover{border-color:var(--gold); background:#2d2542; transform:translateX(4px);}
  button.next{text-align:center; border-color:var(--gold); color:var(--gold); font-weight:bold;}
  .fx{font-family:Verdana,sans-serif; font-size:.72rem; margin-top:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px;}
  .fx span{background:#141020; border:1px solid var(--border); padding:3px 9px; border-radius:99px;}
  .fx .up{color:var(--green);} .fx .down{color:var(--red);}
  .phase-title{
    text-align:center; padding:26px 10px;
  }
  .phase-title .clock{font-family:Verdana,sans-serif; font-size:.8rem; color:var(--muted); letter-spacing:2px;}
  .phase-title h2{color:var(--gold); font-size:1.7rem; margin:8px 0; letter-spacing:1px;}
  .phase-title p{color:var(--muted); font-style:italic;}
  .ending h2{color:var(--gold); font-size:1.5rem; margin-bottom:12px; text-align:center;}
  .ending .medal{font-size:3.5rem; text-align:center; margin-bottom:10px;}
  .roll-note{font-family:Verdana,sans-serif; font-size:.72rem; color:var(--blue); margin-top:10px; letter-spacing:.5px;}
  #intro .roster{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:8px; margin:16px 0;}
  #intro .r{background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:.85rem; line-height:1.4;}
  #intro .r b{color:var(--gold);}
  .small{color:var(--muted); font-size:.8rem; font-style:italic; margin-top:14px;}
  footer{text-align:center; color:#544a72; font-size:.7rem; font-family:Verdana,sans-serif; margin-top:30px; letter-spacing:1px;}

<script>
"use strict";
/* ================= ESTADO ================= */
const S = { alc:0, dig:100, ene:100, din:140, resp:10 };
const LIM = { alc:125, dig:100, ene:100, din:250, resp:100 };
let phaseIdx = 0, queue = [], sceneIdx = 0, log = [], amigo = null;
/* sustituye la descripción del amigo de Pocho (que nunca tiene nombre) */
function T(s){ return amigo ? s.replace(/\{AD\}/g, amigo.d) : s; }

const $ = id => document.getElementById(id);
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* Cuántas veces ha salido cada uno en esta partida. Sirve para que ningún
   chavea acapare: en cada fase se eligen los que menos han aparecido. */
let vistos = {};
function pickFair(pool, n){
  const elegidas = [];
  const restantes = shuffle(pool);
  while(elegidas.length < n && restantes.length){
    // de los que quedan, el mínimo de apariciones acumuladas
    let min = Infinity;
    for(const sc of restantes) min = Math.min(min, vistos[sc.ch]||0);
    const candidatos = restantes.filter(sc => (vistos[sc.ch]||0) === min);
    const sc = candidatos[Math.floor(Math.random()*candidatos.length)];
    restantes.splice(restantes.indexOf(sc), 1);
    vistos[sc.ch] = (vistos[sc.ch]||0) + 1;
    elegidas.push(sc);
  }
  return shuffle(elegidas);
}

const CH = {
  juanjo:{n:"Juanjo «Golosina» Dionisio", a:"🍬"},
  kike:{n:"Enrique «Kike» Hernández", a:"😈"},
  salme:{n:"Salme «Perubian» Salmerón", a:"⚓"},
  guille:{n:"Guille «El Loko»", a:"🔩"},
  turko:{n:"Carlos «El Turko» Macías", a:"🌿"},
  fae:{n:"Faé Andrade", a:"🎺"},
  pocho:{n:"Pocho Rodríguez", a:"🎩"},
  puente:{n:"Alberto de la Puente", a:"🏃"},
  hdez:{n:"Alberto Hernández", a:"🤸"},
  grupo:{n:"Los Chaveas", a:"🍻"},
  amigo:{n:"El amigo de Pocho", a:"🎭"},
  tu:{n:"Tú, el aspirante", a:"🫡"}
};

/* El amigo de Pocho: personaje de novela de ficción, distinto cada partida.
   Nunca tiene nombre. Nadie se lo pregunta y él nunca lo dice. */
const AMIGOS = [
  {d:"Dice que es domador de aves rapaces. Trae un guante de cuero. No trae ave."},
  {d:"Asegura haber sido campeón nacional de algo que nadie logra que repita dos veces igual."},
  {d:"Habla como si estuviera levantando acta de todo lo que ocurre. No es notario."},
  {d:"Dice que tiene un caballo. Insiste MUCHO en el caballo. Nadie ha visto el caballo."},
  {d:"Lleva gorra de marino. Salme le hace tres preguntas técnicas y falla las tres. Se queda igual."},
  {d:"Mide dos metros y habla muy bajito. Hay que acercarse tanto que todas sus historias parecen secretos."},
  {d:"Llega en chándal y con una bolsa de deporte que no abre en toda la noche. Nadie pregunta por la bolsa."}
];

/* ================= FASES Y EVENTOS ================= */
const PHASES = [
/* ---------- FASE 1: LA COMIDA ---------- */
{
  name:"LA COMIDA", clock:"14:00 · Restaurante", pick:3,
  tag:"Todo gran Chavea Day empieza con mantel. Y termina sin él.",
  intro:{ch:"grupo", text:"Llegas al restaurante. Mesa larga, pan ya abierto.\n\nJuanjo sirviendo vino. Kike de pie junto a la mesa con el móvil en la oreja. El Turko oliendo «rico». Faé decidiendo por todos qué se va a comer.\n\nY Pocho, que te recibe con una palmada en la espalda y te señala una silla concreta:\n\n«Tú aquí, chavea. Hoy es TU día. O lo era. Ahora es el nuestro y tú estás de prueba.»\n\nEl camarero se acerca. Todos piden vino. Te miran. Primera decisión oficial del Chavea Day:",
    opts:[
      {t:"«Vino para mí también, por supuesto.»", out:{r:"Asentimiento general. Juanjo te sirve él mismo, hasta arriba, como marcan los cánones. «Así empezamos bien», dice, sin saber que ese mismo vino escribirá su historia esta noche... como siempre.", fx:{resp:+8, alc:+8}}},
      {t:"«Una cerveza de momento, que hay que dosificar.»", out:{r:"«Dosificar», repite Faé, saboreando la palabra como si fuera un idioma extranjero. Se acepta, pero Salme lo apunta en el registro mental que luego comenta todo.", fx:{resp:+3, alc:+5}}},
      {t:"«Agua con gas, por favor.»", out:{r:"Se hace un silencio tan denso que se podría cortar con el cuchillo del pan. Kike levanta la vista del móvil por primera vez en el día. Guille suelta una risita inquietante.\n\nPocho, diplomático: «El chavea es de bromas. Trae vino.»", fx:{resp:-10, alc:+6, dig:-5}}}
    ]},
  pool:[
    {ch:"juanjo", text:"Juanjo levanta su copa y te mira fijamente. «Regla número uno del Chavea Day: aquí el vino no se pide, se hereda. Y regla número dos: el que brinda, sigue el ritmo del que más aguanta. Que soy yo.»\n\nEmpieza a rellenarte la copa cada vez que baja del ecuador.",
      opts:[
        {t:"Seguirle el ritmo copa a copa", roll:{stat:"alc", dc:80, ok:{r:"Aguantas el pulso enológico con una dignidad que sorprende a la mesa. Juanjo te mira con el respeto de un sumiller a otro. «Este chavea promete», sentencia, sirviendo otra ronda.", fx:{resp:+12, alc:+15}}, ko:{r:"A la cuarta copa el mantel empieza a parecerte una superficie inestable. Confundes el nombre de Kike con el de Guille, que es objetivamente imposible. Juanjo sonríe: «Flojito... pero con ganas. Se valora.»", fx:{resp:+4, alc:+22, dig:-8}}}},
        {t:"Beber a tu ritmo con elegancia", out:{r:"Sorbos medidos, copa siempre en mano, sin dejarla morir. Técnica de veterano. Nadie te puede acusar de nada. El Turko, que se da cuenta de todo, te guiña un ojo.", fx:{resp:+5, alc:+10}}},
        {t:"Aguar el vino disimuladamente con gaseosa", out:{r:"Craso error. Pocho es auditor de ciberseguridad: detecta anomalías por profesión y por vocación. «Chavea... ¿eso es GASEOSA?» La mesa entera se gira. Juanjo se lleva la mano al pecho como si le hubieran insultado a la familia.", fx:{resp:-12, dig:-6, alc:+4}}}
      ]},
    {ch:"juanjo", text:"Descubres una cosa sobre Juanjo: no habla, SUBTITULA. Cada frase viene con su gesto ilustrativo obligatorio, por evidente que sea la frase.\n\n«Qué sed» → mano en jarra bebiendo del aire.\n«Ese tío conducía fatal» → volante imaginario dando bandazos.\n«Y me lo comí entero» → tenedor fantasma a la boca, mandíbula incluida.\n«Y le colgué el teléfono» → meñique y pulgar en la oreja, por si no quedaba claro qué es un teléfono.\n\nEn el clímax de la anécdota, un revés amplio tira la copa de Kike, que la esquiva con un reflejo tan automático que está claro que lleva veinte años entrenándolo.\n\n«¿Me sigues?», te pregunta Juanjo, con las manos aún en el aire, congeladas a media frase.",
      opts:[
        {t:"«Te sigo perfectamente. Sobre todo por los gestos.»", out:{r:"«¿Qué gestos?», pregunta Juanjo... abriendo las dos manos en el gesto universal de «¿qué gestos?». La mesa se viene abajo. Y a los tres segundos vuelve a subir los brazos para explicarte, gesticulando MÁS QUE ANTES, que él no gesticula nada.\n\nKike, sin levantar la vista: «Lleva así desde el colegio. Yo ya me siento en diagonal.»", fx:{resp:+9}}},
        {t:"Contestarle solo con gestos, sin hablar", out:{r:"Le respondes en su idioma nativo: mímica pura. Le pides una cerveza (jarra al aire), le dices que la historia era larga (mano estirándose al infinito) y le señalas la copa que acaba de tirar (dedo acusador + gesto de derrame).\n\nJuanjo se para en seco... y ACELERA. Duelo de mímica a dos bandas, de pie, sin una sola palabra, mientras la mesa arbitra a gritos. Empate técnico. Faé lo bautiza: «Esgrima chavea.» Nace una tradición.", fx:{resp:+12, ene:-4, dig:-3}}},
        {t:"Apartar discretamente tu copa de la zona de impacto", out:{r:"Movimiento defensivo de veterano prematuro. Nadie lo comenta, pero el Turko lo ve, sonríe y aparta la suya también. Habéis formado, sin decir palabra, el escudo antimisiles de la mesa. Puntúa poco, pero salva vidas.", fx:{resp:+4}}}
      ]},
    {ch:"kike", text:"Suena el móvil de Kike. Otra vez. Se levanta con el «un segundo» número catorce del día y se aleja hablando en voz baja con una mano en el bolsillo.\n\nSalme aprovecha: «Venga, aspirante, prueba clásica: ¿de quién es la llamada? Apuesta un chupito.»",
      opts:[
        {t:"«De la novia, obviamente.»", out:{r:"Kike vuelve. Faé, sin filtro: «¿La novia?» Kike: «...era del trabajo.» Nadie le cree. Nunca nadie le cree. Pero técnicamente has perdido la apuesta y pagas el chupito. El misterio de las llamadas de Kike sigue invicto, como debe ser.", fx:{din:-3, alc:+6, resp:+3}}},
        {t:"«Negocios. Ese hombre tiene NEGOCIOS.»", out:{r:"La mesa asiente con solemnidad. Es la respuesta correcta espiritualmente, aunque sea inverificable. Kike vuelve, se le pregunta, responde «cosas» y se guarda el móvil. «Cosas», repite Guille fascinado. Ganas el chupito por aclamación popular.", fx:{resp:+8, alc:+5}}},
        {t:"«Es la O.R.A., que sin él el sistema colapsa.»", out:{r:"Carcajada general. Un ingeniero industrial gestionando zonas de aparcamiento regulado es exactamente el tipo de dato que esta mesa jamás olvidará ni perdonará. Kike vuelve y no entiende por qué todos le aplauden. Chupito gratis para ti.", fx:{resp:+9, alc:+5}}}
      ]},
    {ch:"salme", text:"Salme lleva diez minutos con el codo en la mesa mirando hacia una mesa donde comen varias amigas. Sin girar la cabeza, te dice: «Aspirante. Análisis táctico. ¿Entro por Instagram o entro en persona? Rápido, que esto es un examen.»",
      opts:[
        {t:"«Instagram. Tu terreno, capitán.»", out:{r:"«Correcto», dice, ya con el móvil fuera. En un movimiento que viola varias leyes de la física social, consigue que una de ellas le siga ANTES de acabar el postre. La mesa lo celebra como un gol en el descuento. Tú has sido parte del cuerpo técnico.", fx:{resp:+8}}},
        {t:"«En persona. Los clásicos nunca fallan.»", out:{r:"Salme niega lentamente, decepcionado. «En persona en la COMIDA no, chavea. En persona se entra de noche. De día se siembra, de noche se recoge. Apunta.» Has fallado el examen, pero la clase magistral valió la pena.", fx:{resp:-3, alc:+4}}},
        {t:"«¿Y si te presentas como dueño de una escuela náutica?»", out:{r:"Silencio. Salme te mira como si acabaras de inventar el fuego. «...El barco. SIEMPRE el barco. Chavea, eres un peligro.» Guarda la frase para esta noche. Te has ganado su respeto profesional.", fx:{resp:+10}}}
      ]},
    {ch:"turko", text:"Entre el segundo plato y el postre, el Turko se levanta con parsimonia de arquitecto. «Voy a ver la fachada del edificio de enfrente. Interesante juego de volúmenes.»\n\nTe mira. Es una invitación. Todos saben qué tipo de «arquitectura» se estudia en esa esquina.",
      opts:[
        {t:"Acompañarle a «estudiar la fachada»", out:{r:"La fachada, efectivamente, mejora por momentos. El Turko te explica la diferencia entre un voladizo y una cornisa mientras el mundo se vuelve un 20% más amable. Vuelves a la mesa oliendo rico los dos y con un hambre repentina de postre.\n\nPocho os recibe: «¿Qué tal la fachada?» — «Brutalista», responde el Turko. Nadie pregunta más.", fx:{resp:+8, ene:-8, alc:+2}}},
        {t:"«Ahora no, que viene el postre.»", out:{r:"El Turko asiente sin juzgar. Es el único del grupo que jamás juzga: él va a su ritmo y respeta el de los demás. Vuelve a los diez minutos oliendo rico, con los ojos a media asta, y pide flan.", fx:{ene:+3}}},
        {t:"«¿Fachada? Pero si es un bloque de los 80...»", out:{r:"El Turko te pone la mano en el hombro con infinita paciencia. «Chavea. La fachada... es una metáfora.» La mesa entera estalla. Faé llora de risa. Has estado cerca de romper el protocolo más sagrado del grupo.", fx:{resp:-4, dig:-3}}}
      ]},
    {ch:"fae", text:"Faé golpea la copa con el cuchillo. Se sube a MEDIA silla (por ahora solo media). «¡Un brindis! Por el aspirante. Que hable él. QUE HABLE. QUE-HA-BLE.»\n\nLa mesa entera corea. El restaurante entero mira.",
      opts:[
        {t:"Ponerte de pie y soltar un discurso épico", roll:{stat:"dig", dc:75, ok:{r:"Te arrancas con un discurso sobre la amistad, el vino y los cuerpos que aguantan. Cierras con un «¡Por los chaveas, que el hígado nos pille confesados!» que hace que hasta la mesa de al lado brinde. Faé te abraza. Ha nacido una leyenda.", fx:{resp:+14, alc:+8}}, ko:{r:"Empiezas bien, pero a mitad de discurso se te cruza la sintaxis y terminas diciendo «por el vino de la amistad del cuerpo». Faé lo remata: «¡ESO! ¡Lo que ha dicho!» y todos brindan igual. En este grupo, fracasar con entusiasmo también puntúa.", fx:{resp:+6, dig:-8, alc:+8}}}},
        {t:"Brindis corto y digno: «Por vosotros, chaveas.»", out:{r:"Sobrio, efectivo, profesional. Pocho asiente con aprobación de auditor: sin riesgos innecesarios. Faé, algo decepcionado por la falta de espectáculo, se encarga él mismo de alargar el brindis cuatro minutos más.", fx:{resp:+5, alc:+5}}},
        {t:"Hacerte el longuis mirando el móvil", out:{r:"Error de novato. Faé redirige el foco: «¡EL ASPIRANTE PASA DE NOSOTROS!» Ahora todo el restaurante te mira mientras finges responder un correo urgente un sábado a las cuatro de la tarde. Nadie te cree.", fx:{resp:-8, dig:-5}}}
      ]},
    {ch:"guille", text:"Te ha tocado al lado de Guille y llevas media comida descubriendo que es, con diferencia, el más tranquilo de la mesa.\n\nMientras Faé grita y Juanjo derrama, Guille come ordenadamente, escucha, hace preguntas concretas y te ha explicado dos cosas técnicas que no sabías. Cero alarmas. Un tío estupendo.\n\nY entonces, mirando su copa, comenta con toda la calma del mundo:\n\n«Yo hoy voy a ir poco a poco, ¿eh? Que si no me pongo tontísimo.»\n\nLa mesa entera se calla un segundo. Y Pocho, sin levantar la vista del plato, murmura: «Ha dicho la frase.»",
      opts:[
        {t:"«¿Qué frase? ¿De qué habláis?»", out:{r:"Nadie te contesta directamente. Juanjo hace un gesto con las manos que podría significar «explosión» o «despegue» o las dos cosas. Kike te mira y niega despacio.\n\nEl Turko se apiada de ti: «Todos los años dice que va a ir poco a poco. Y todos los años, chavea, va poco a poco... hasta que ya no.»\n\nGuille, ajeno, te sirve agua muy educadamente. Empiezas a entender de dónde le viene el mote.", fx:{resp:+8}}},
        {t:"«Poco a poco los dos entonces, Guille.»", out:{r:"Le chocas la copa y pactáis moderación mutua. Guille se ilumina: «¡ESO! ¡Un compañero de moderación!»\n\nLos chaveas os observan como se observa a dos personas firmando un contrato que ambas van a incumplir. Pocho lo resume: «Precioso. Se les ve muy convencidos.» El pacto durará hasta las siete de la tarde y ha quedado registrado ante testigos.", fx:{resp:+10, alc:+6}}},
        {t:"Aprovechar y rellenarle la copa hasta arriba", out:{r:"Le llenas la copa sonriendo. Guille la mira, te mira, y con toda la lógica de su cerebro de ingeniero concluye: «Bueno, si ya está servida...»\n\nY se la bebe. La mesa entera te localiza como el responsable oficial de haber adelantado el reloj del Loko dos horas. Faé lo celebra. Pocho no. Pocho apunta.\n\nEsta noche, cuando pase lo que pase, todo el mundo va a saber quién empezó.", fx:{resp:+5, alc:+8, dig:-5}}}
      ]}
  ]
},
/* ---------- FASE 2: LA SOBREMESA ---------- */
{
  name:"LA SOBREMESA", clock:"17:30 · Cafés y verdades", pick:3, drift:{alc:+5, ene:-8, din:-20},
  tag:"La comida terminó hace una hora. Nadie se ha movido. Llegan los cafés y las historias.",
  intro:{ch:"grupo", text:"Los platos han desaparecido y llega el momento litúrgico que precede a todo: LA RONDA DE CAFÉS. Ley no escrita del Chavea Day: aquí nadie pide la primera copa sin su café antes. El café es la bisagra del día: cierra la comida y abre TODO lo demás.\n\nMientras tanto empieza la hora sagrada de las historias: sale lo de Australia, sale la voltereta, sale —cómo no— la noche de las cortinas. Esto es historia oral. Esto es patrimonio.\n\nEl camarero te mira. ¿Qué pides?",
    opts:[
      {t:"Café solo, como los veteranos", out:{r:"«Café solo», asiente Juanjo con aprobación de notario. Protocolo respetado. La cafeína entra a trabajar sabiendo lo que le viene encima: primero el café, LUEGO el gin-tonic. El orden de los factores aquí SÍ altera el producto.", fx:{ene:+10, din:-2, resp:+4}}},
      {t:"«¿Café? Tráeme ya el primer gin-tonic.»", out:{r:"Silencio. Faé deja la cucharilla en el aire. «Sin... ¿sin café?» Pocho interviene con paciencia de mediocentro: «Chavea, la copa sin café es ansia. La copa DESPUÉS del café es cultura.» Te traen el gin-tonic... y un café de castigo que te tomas bajo supervisión.", fx:{alc:+10, din:-9, resp:-4, ene:+5}}},
      {t:"Café con Baileys", out:{r:"«Café con Baileys», repites, y la mesa se detiene. Es la tercera vía: técnicamente café, espiritualmente copa, oficialmente postre. Nadie puede acusarte de saltarte el protocolo ni de ir con pies de plomo.\n\n«Este chavea entiende los MATICES», dictamina el Turko. Faé pide otro igual. En diez minutos hay ocho cafés con Baileys en la mesa —los siete chaveas y tú— y el camarero ha tenido que bajar al almacén a por otra botella.", fx:{ene:+6, alc:+6, resp:+7, din:-4}}}
    ]},
  pool:[
    {ch:"grupo", text:"De debajo de la mesa empiezan a salir BOLSAS. Hoy tocaba entrega de regalos y nadie te avisó (o no escuchaste, que a estas alturas ya es posible).\n\nEl repaso histórico es obligatorio antes de abrir nada. El año de la CAMISETA sigue siendo el listón: camiseta de fútbol oficial de los chaveas, con su escudo, y la BANDERA a juego que desde entonces preside cada Chavea Day colgada donde se pueda. Y el año del CANDADO DE BICI, que nadie ha sabido explicar nunca, ni el que lo regaló ni el que lo recibió, y que por eso mismo es sagrado.\n\nSe reparte lo de este año: una petaca grabada para Juanjo, un cenicero de diseño para el Turko, un SILBATO para Faé —error histórico que pagaréis todos esta noche— y unas gafas de sol para Kike «para el barco».\n\nY entonces la mesa entera se gira hacia ti: ¿y el aspirante qué ha traído?",
      opts:[
        {t:"Improvisar: regalar tu mechero «con historia»", roll:{stat:"dig", dc:65, ok:{r:"Sacas tu mechero y le inventas sobre la marcha una biografía épica: «Este mechero ha encendido cigarros en tres países y una boda que no debía.» Se lo entregas a Juanjo con solemnidad. La mesa APLAUDE la jugada: no era el regalo, era el CUENTO. Aquí se valora el relato por encima del objeto: por eso el candado de bici es historia y una corbata cara no lo sería jamás.", fx:{resp:+10}}, ko:{r:"Sacas el mechero, empiezas la historia... y te quedas en blanco a mitad. «...y por eso es especial», cierras en falso. Silencio piadoso. Faé lo salva estrenando el silbato. Pocho anota: «Regalo: improvisado. Ejecución: mejorable. Intención: correcta.»", fx:{resp:+3, dig:-5}}}},
        {t:"Preguntar cómo consigues la camiseta y la bandera", out:{r:"La pregunta correcta en el momento correcto. Se hace un silencio reverencial y Pocho responde con la gravedad de un notario: «La camiseta no se pide, chavea. La camiseta se GANA.» Faé, ya emocionado, empieza a contar el año de la entrega como quien narra una final. Juanjo gesticula el escudo en el aire.\n\nNo has traído regalo, pero acabas de demostrar que entiendes qué es lo que de verdad se regala aquí.", fx:{resp:+11}}},
        {t:"«El año que viene traigo regalos DOBLES. Palabra.»", out:{r:"«¿Dobles?», repite Kike, interesado. «Que conste en acta», dice Pocho, y lo peor es que CONSTARÁ: este grupo olvida dónde aparcó pero jamás olvida una promesa de regalos. Acabas de hipotecar tu próximo Chavea Day, pero has comprado tiempo con elegancia.", fx:{resp:+5}}},
        {t:"Escaquearte al baño hasta que pase el temporal", out:{r:"Vuelves a los diez minutos confiando en que la marea haya pasado. Error: la mesa entera te espera EN SILENCIO, con los regalos ya entregados y una silla vacía en el centro. «Te hemos guardado el turno», sonríe Faé. No hay escapatoria en el Chavea Day. Nunca la hubo.", fx:{resp:-7, dig:-4}}}
      ]},
    {ch:"juanjo", text:"A mitad de una frase, Juanjo se calla. Sus carrillos se hinchan lentamente, como un pez globo con corbata. Boca cerrada. Mirada al infinito. Saliva operando a máxima capacidad.\n\nEl ácido. Ha llegado el ácido. Los veteranos ni se inmutan. Tú eres nuevo. ¿Qué haces?",
      opts:[
        {t:"Seguir la conversación como si nada", out:{r:"Correcto. CORRECTÍSIMO. Continúas hablando de fútbol mirando a Juanjo con normalidad absoluta mientras él gestiona su ecosistema interno. Veinte segundos después: traga, exhala, y retoma la frase EXACTAMENTE donde la dejó.\n\nPocho te susurra: «Has visto al ácido y no has parpadeado. Eso no se enseña.»", fx:{resp:+12}}},
        {t:"Preguntarle si está bien y ofrecerle agua", out:{r:"Juanjo te fulmina con la mirada sin poder hablar, los carrillos a máxima presión. Kike te aparta con suavidad: «No lo mires. No le hables. Es como los eclipses: se sabe que está pasando, pero no se observa directamente.»", fx:{resp:-5}}},
        {t:"Apartarte medio metro con disimulo", out:{r:"Comprensible pero cobarde. Juanjo resuelve el episodio con la elegancia de siempre (esta vez traga) y te mira con un puntito de decepción. «El ácido nunca ha salpicado a un inocente», dice muy serio. Guille: «Lo de las cortinas fue vino, técnicamente.»", fx:{resp:-3, dig:-2}}}
      ]},
    {ch:"guille", text:"Llevas todo el día hablando con Guille y no entiendes por qué le llaman el Loko. Es el más tranquilo de la mesa: analítico, ordenado, te ha explicado con una servilleta y dos cubiertos por qué el tren de alta velocidad frena antes de lo que parece. Educadísimo. Metódico.\n\nY entonces, entre un gin-tonic y el siguiente, sin transición, SIN AVISO: la servilleta cae, la frase se le desarma a mitad y te agarra del cuello con un cariño que corta la circulación.\n\n«Tú... tú eresh... eshcúchame... TÚ ERESH IMPORTANTE.»\n\nAhí está. El cable. La mesa observa con interés científico: acabas de presenciar la transición en directo.",
      opts:[
        {t:"Asentir solemnemente y brindar con él", out:{r:"«¡ESHO!» Guille brinda contigo, te abraza con fuerza de reentrada atmosférica y se calma. Los chaveas asienten: has domado al Loko en su primera fase. «Al Loko no se le contradice, se le acompaña», te explica Salme. «Es como el mar.»", fx:{resp:+10, alc:+7, ene:-4}}},
        {t:"«¿Qué me quieres decir exactamente, Guille?»", roll:{stat:"ene", dc:70, ok:{r:"Te sumerges en veinte minutos de balbuceo y, contra todo pronóstico, encuentras el hilo: el ingeniero sigue ahí dentro, y te está explicando —a su manera, con la mitad de las consonantes— que la amistad es como una órbita estable: no se sostiene sola, hace falta velocidad. Es... precioso. Se lo dices. Se emociona. La mesa aplaude.", fx:{resp:+12, ene:-10}}, ko:{r:"Intentas descifrarlo pero el mensaje se degrada por momentos. En algún punto Guille pasa del cariño a la fase «¿tú qué me eshtás mirando?» y Pocho tiene que intervenir con un chupito diplomático que reinicia el sistema. Por poco.", fx:{resp:+2, ene:-12, dig:-4}}}},
        {t:"Zafarte del abrazo con una excusa", out:{r:"Mala idea. Rechazar al Loko en fase cariñosa acelera la transición a fases menos cariñosas. La mesa entera hace «uuuuh» en voz baja. Pocho despliega el protocolo: chupito, cigarro, y a Guille se le olvida. Pero la mesa no olvida que lo provocaste tú.", fx:{resp:-7, dig:-3}}}
      ]},
    {ch:"guille", text:"Guille aparece con el paquete de tabaco abierto en abanico y el IQOS en la otra mano, como un crupier ofreciendo cartas. «¿Fumas? Toma. Coge. COGE.» Insiste hasta que aceptas algo.\n\nCuarenta minutos después vuelve, con el paquete vacío y las manos también: «Chavea... ¿te queda alguno?»\n\nEs el ciclo de Guille: da todo lo que tiene y luego lo reclama de vuelta, con la misma inocencia absoluta en ambas direcciones.",
      opts:[
        {t:"Devolverle uno de los suyos sin decir nada", out:{r:"Le pasas uno de los que él mismo te dio hace media hora. Guille lo enciende agradecidísimo: «Eresh un tío legal, chavea. LEGAL.» No tiene ni la más remota idea de que es su propio cigarro. Nunca la tiene. Esto ocurre cinco veces por Chavea Day y el sistema funciona por consenso tácito.", fx:{resp:+8, ene:-3}}},
        {t:"«Guille, este es TUYO. Me lo diste tú.»", out:{r:"Guille frunce el ceño intentando procesar la paradoja temporal. «¿Mío?... ¿Y cómo lo tienes TÚ?» El bucle lógico le ocupa un minuto entero de silencio. Al final decide: «Bueno, pues ahora es tuyo... ¿me lo dash?» Se lo das. Es imposible ganar esta conversación y ahí reside su belleza.", fx:{resp:+6}}},
        {t:"Comprar un paquete entero y dárselo", out:{r:"Bajas al estanco y vuelves con un paquete completo que le entregas sin ceremonia. Guille lo mira como si le hubieras regalado un planeta. Te abraza durante nueve segundos ininterrumpidos. Al final de la noche, ese paquete habrá circulado por las manos de los siete chaveas y volverá a ti, vacío, con dos cigarros que nadie sabe de dónde han salido.", fx:{resp:+11, din:-6, ene:-4}}}
      ]},
    {ch:"pocho", text:"Te levantas para ir al baño y, cuando vuelves, en tu sitio hay una copa nueva. No la has pedido. Nadie te ha preguntado. Está ahí, servida, con hielo justo, esperándote.\n\nMiras a Pocho. Pocho no te mira: está de espaldas hablando con Juanjo, en perfil bajo, como si no tuviera nada que ver con el asunto.\n\nLuego te fijas mejor: hay una copa nueva delante de CADA UNO. Las siete. Nadie ha visto cuándo ha pasado. Esto lleva ocurriendo desde las dos de la tarde y no te habías dado cuenta hasta ahora.",
      opts:[
        {t:"Beberla y decirle «gracias, mediocentro»", out:{r:"Pocho se gira, sonríe media sonrisa y no dice nada. Vuelve a lo suyo.\n\nMás tarde, ya con la noche encima, te lo explicará el Turko: «Lleva quince años haciendo eso. Nadie se lo pide. Nadie le paga. Él simplemente hace que la fiesta no se pare nunca. Por eso es el mediocentro.» Haberte dado cuenta ya te pone por delante de mucha gente.", fx:{resp:+10, alc:+8}}},
        {t:"Ir a la barra y pagar tú la siguiente ronda entera", out:{r:"Te levantas sin avisar, pagas la ronda completa y las traes tú, con el equilibrio precario del aprendiz. Cuando las plantas en la mesa, Pocho levanta la vista y esta vez sí te mira. Un buen rato.\n\n«Vaya», dice. Nada más. Pero es un «vaya» que va a durar años: acabas de hacerle a Pocho lo que Pocho le hace a todo el mundo, y a Pocho no se lo hace nadie.", fx:{resp:+14, din:-25, alc:+7}}},
        {t:"«Pocho, para, que ya llevo tres.»", out:{r:"«Ya lo sé», dice tranquilamente, sin girarse. «Llevas tres y media. Y esta es la última hasta las copas, porque si te la bebes ahora vas a llegar bien a las once.»\n\nSe gira por fin: «¿Tú te crees que esto lo hago a lo loco?» Y no, no lo hace a lo loco. NUNCA lo hace a lo loco. Ese es el detalle que casi nadie pilla de Pocho.", fx:{resp:+8, alc:+5}}}
      ]},
    {ch:"turko", text:"El Turko lleva media hora con el móvil, tecleando. Al principio pensabas que era Instagram. No: son PLANOS. Está respondiendo a un cliente. Un sábado. A las siete de la tarde. En pleno Chavea Day.\n\n«Chavea, tú que estás fresco: si tengo un forjado que tiene que salvar seis metros y el cliente no quiere pilares... ¿tú qué harías?»\n\nLa mesa entera gruñe al unísono: «¡¡TURKOOO!!»",
      opts:[
        {t:"Seguirle el rollo y proponer una solución absurda", out:{r:"«Yo pondría un pilar y le diría que es decorativo.» El Turko se queda quieto tres segundos... y luego asiente muy despacio: «...Eso podría funcionar.» Y LO ANOTA. La mesa estalla. Faé: «¡Ha apuntado la chorrada! ¡LA HA APUNTADO!» El lunes, en algún despacho, alguien defenderá tu idea con cara seria.", fx:{resp:+11}}},
        {t:"Quitarle el móvil y esconderlo", out:{r:"Se lo arrancas de las manos y se lo pasas a Pocho, que lo hace desaparecer en el bolsillo de las trampas. El Turko protesta débilmente («es que el cliente...») y la mesa lo abuchea con cariño: «¡SIEMPRE IGUAL! ¡SIEMPRE HASTA EL ÚLTIMO MOMENTO!» A los diez minutos se le ha olvidado y está más feliz. Le has salvado el día y él lo sabe.", fx:{resp:+12, ene:-3}}},
        {t:"Ponerte a resolverle el problema en serio", out:{r:"Cometes el error de INTERESARTE. Veinte minutos después estáis los dos con servilletas dibujando vigas mientras el resto del grupo os mira con auténtica pena. Juanjo, gesticulando: «Hemos perdido a dos.» Aprendes que en el Chavea Day el curro se aparca, se ridiculiza y se olvida. En ese orden.", fx:{resp:-5, ene:-6}}}
      ]},
    {ch:"salme", text:"Salme lleva veinte minutos con el móvil en horizontal, enseñándole la pantalla a Kike, y de pronto se gira hacia ti y te lo planta delante sin avisar.\n\nEs el Instagram de la escuela náutica. Un vídeo de un velero al atardecer, música épica, texto encima: «TU PRÓXIMA AVENTURA EMPIEZA AQUÍ.»\n\n«Chavea. Opinión sincera. ¿Funciona o no funciona?»\n\nLa mesa entera espera. Es un examen y no sabes de qué asignatura.",
      opts:[
        {t:"«Funciona. Pero cámbiale la música.»", out:{r:"Salme se queda quieto. Vuelve a poner el vídeo. Lo ve otra vez. «...La música.» Pausa larga. «LA MÚSICA.»\n\nSe pasa el resto de la sobremesa buscando canciones y a las ocho de la tarde el vídeo está republicado con música nueva. A la semana tendrá el triple de visitas y él te lo recordará durante años. Has entrado en el consejo asesor de la escuela náutica sin cobrar nada.", fx:{resp:+11}}},
        {t:"«Aquí lo que vende eres tú, no el barco.»", out:{r:"Silencio en la mesa. Y entonces Faé estalla: «¡LO HA DICHO! ¡LLEVAMOS DIEZ AÑOS DICIÉNDOSELO!»\n\nSalme finge indignación pero está claramente encantado. «Yo salgo poco porque soy discreto.» Carcajada general: el hombre más discreto del Instagram. Buen ojo, chavea: has tocado exactamente el nervio del grupo.", fx:{resp:+10, alc:+5}}},
        {t:"«Yo de barcos no entiendo nada, Salme.»", out:{r:"«No te he preguntado de barcos», responde con paciencia. «Te he preguntado de INSTAGRAM.» Y ahí está el error: creías que el negocio de Salme eran los barcos.\n\nEl negocio de Salme nunca han sido los barcos. Guarda el móvil algo decepcionado y le pregunta al Turko, que le da tres ideas buenas sin apenas levantar la vista.", fx:{resp:-4}}}
      ]},
    {ch:"fae", text:"La sobremesa lleva dos horas y Faé no ha estado sentado ni veinte minutos seguidos. Ha cambiado de silla cuatro veces, ha hablado con la mesa de al lado, ha ido a la barra a hacerse amigo del camarero y ahora está de pie detrás de ti con las dos manos en el respaldo de tu silla.\n\n«Chavea. Chavea. Estoy pensando una cosa.»\n\nCuando Faé está pensando una cosa, la mesa entera se prepara. Nunca es una cosa pequeña.",
      opts:[
        {t:"«Dime. Te escucho.»", out:{r:"La cosa es esta: quiere organizar un CAMPEONATO. De qué, no lo tiene claro todavía. Pero hay premio (una servilleta firmada), hay bases (que va inventando mientras habla) y hay comisario (tú).\n\nMedia hora después hay un campeonato de tirar tapones a un vaso con ocho participantes, clasificación escrita en el mantel y una polémica arbitral que llegará hasta los churros del amanecer. Y el organizador oficial figuras tú.", fx:{resp:+11, ene:-5}}},
        {t:"«Faé, tío, siéntate y descansa un rato.»", out:{r:"Le pones la mano en el hombro y le señalas la silla. Faé se sienta. Dura ocho segundos.\n\nA los ocho segundos está de pie otra vez, esta vez explicándole su idea a Guille, que la mejora, que es lo peor que le puede pasar a una idea de Faé. Lo has intentado. Nadie ha conseguido nunca sentar a este hombre.", fx:{resp:+3, ene:+5}}},
        {t:"Adelantarte y proponer tú la idea del día", out:{r:"Le robas el turno: propones tú un campeonato de brindis por parejas. Faé se queda a media frase, procesando el atrevimiento... y luego te agarra la cara con las dos manos:\n\n«¡ESTE CHAVEA PIENSA COMO YO!»\n\nEs peligrosísimo que Faé encuentre un cómplice, y acabas de ofrecerte voluntario. El resto del día lo pagaréis todos. Puntúa muchísimo.", fx:{resp:+13, alc:+7, dig:-4}}}
      ]},
    {ch:"pocho", text:"Pocho da dos palmadas. Del bolsillo interior de la chaqueta —un bolsillo que parece contener más de lo que la física permite— saca la señal universal: «RONDA DE CHUPITOS. Aquí no se libra ni el aspirante. ESPECIALMENTE el aspirante.»",
      opts:[
        {t:"«Venga, el mío doble, que soy nuevo.»", out:{r:"La frase correcta en el momento correcto. La mesa ruge. Pocho te sirve el doble con el orgullo de un padre. «¿Habéis visto? ESO es actitud de chavea.» Tu hígado presenta su dimisión, que es rechazada.", fx:{resp:+13, alc:+16}}},
        {t:"Tomarte el reglamentario sin protestar", out:{r:"Cumples. El chupito baja, la maquinaria sigue. Pocho asiente: no todos los goles son de chilena, algunos son de penalti bien tirado.", fx:{resp:+5, alc:+9}}},
        {t:"Pasarle tu chupito a Guille disimuladamente", roll:{stat:"dig", dc:80, ok:{r:"Maniobra de alto riesgo ejecutada con éxito: Guille se encuentra dos chupitos y los interpreta como un regalo del cosmos. Se los bebe encantado. Nadie más lo ha visto... aunque acabas de acelerar el cruce de cable del Loko. Que las consecuencias te pillen lejos.", fx:{resp:+3}}, ko:{r:"«Chavea.» Es todo lo que dice Pocho. Una palabra, como un asiento contable: fecha, hora, infracción. Te sirve otro. La mesa observa en silencio ceremonial cómo pagas tu deuda. Con intereses.", fx:{resp:-6, alc:+14}}}}
      ]},
    {ch:"kike", text:"Kike ha cometido el error táctico del día: dos copas seguidas al ritmo de la mesa. El resultado es inmediato y conocido: sonríe mucho, habla poco y lo poco que dice no compila. Se levanta hacia el baño trazando un zigzag perfecto entre las mesas, como si esquivara boyas invisibles.",
      opts:[
        {t:"Escoltarlo discretamente hasta el baño", out:{r:"Caminas a su lado sin tocarle, como un remolcador de puerto. Kike llega, vuelve, y en su idioma actual de sonrisas y monosílabos te dice algo que interpretas como gratitud eterna. Suena su móvil. Lo coge. Y de pronto habla PERFECTAMENTE. La mesa lleva años estudiando este fenómeno sin éxito.", fx:{resp:+9, ene:-3}}},
        {t:"Narrar el zigzag en directo como comentarista", out:{r:"«Sale del área, deja atrás la primera mesa, recorte a la izquierda, LA SILLA, esquiva la silla, señoras y señores, ESTO ES CONDUCCIÓN...» La mesa llora. Salme lo graba. Kike, al volver, pide que le enseñen el vídeo y es el que más se ríe, aunque no del todo seguro de qué.", fx:{resp:+11, dig:-2}}},
        {t:"Apostar 5€ con Faé a que no llega recto", out:{r:"Pierde todo el mundo: Kike no llega recto (pierdes tú, que apostaste a fe ciega el «llega»... error de novato: nadie apuesta a que Kike llega recto). Faé recoge tus 5€ con una reverencia. Lección cara pero justa.", fx:{din:-5, resp:+3, alc:+4}}}
      ]},
    {ch:"grupo", text:"Sale LA historia: el día que Juanjo, en plena naturaleza, intentó alcanzar una naranja de un naranjo, calculó mal el salto, cayó como un saco de patatas y se hizo un esguince. Volvió a la civilización usando a Pocho de bastón humano durante kilómetros.\n\nFaé, con un brillo peligroso en los ojos: «Aspirante. Reproduce el salto. Hay una lámpara ahí que hace de naranja perfectamente.»",
      opts:[
        {t:"Reproducir el salto histórico", roll:{stat:"ene", dc:75, ok:{r:"Coges carrerilla entre las mesas, saltas, rozas la lámpara con la punta de los dedos y aterrizas LIMPIO. El restaurante entero aplaude. Juanjo se levanta y te da un abrazo emocionado: «Lo que yo no pude... lo has hecho tú.» Hay lágrimas. Posiblemente de la ginebra, pero hay lágrimas.", fx:{resp:+14, ene:-8}}, ko:{r:"Coges carrerilla, saltas... y aterrizas EXACTAMENTE como Juanjo en su día: mal. El tobillo protesta. La mesa se divide entre la carcajada y el homenaje: «¡IGUAL! ¡Lo ha hecho IGUAL!» Pocho suspira y te ofrece el hombro: «Vamos, bastón dos, la secuela.»", fx:{resp:+8, ene:-18, dig:-6}}}},
        {t:"Narrar el salto con reconstrucción teatral (sin saltar)", out:{r:"Te levantas y recreas el momento a cámara lenta: la mirada a la naranja, la ambición, el error de cálculo, la caída, el grito. Tu interpretación de «Pocho convertido en bastón» arranca la ovación de la tarde. Juanjo aplaude: «Así fue. Exactamente así de ridículo.»", fx:{resp:+9, dig:+2}}},
        {t:"«Yo por una naranja no salto.»", out:{r:"«Nadie salta POR LA NARANJA, chavea», explica Juanjo con gravedad filosófica. «Se salta por saltar. La naranja es lo de menos.» Toda la mesa asiente como si fuera Séneca. Has perdido una oportunidad de oro de entender el espíritu del grupo.", fx:{resp:-5}}}
      ]},
    {ch:"juanjo", text:"Juanjo se pone nostálgico con el gin-tonic: «¿Sabéis? Cuando dejé lo de tesorero y me fui el año a Australia a encontrarme a mí mismo...»\n\nFaé, automático: «¿Y te encontraste?» — Juanjo: «Encontré cosas.» \n\nSe gira hacia ti: «¿Tú qué opinas, aspirante? ¿Uno puede encontrarse a sí mismo?»",
      opts:[
        {t:"«Uno no se encuentra: se construye. Como este día.»", out:{r:"Silencio reverencial. Juanjo se queda mirándote, asiente lento y alza la copa: «El chavea filósofo.» El Turko, desde su nube: «Profundo.» Has conectado con el lado espiritual del grupo, que existe y aflora exactamente entre el tercer y cuarto gin-tonic.", fx:{resp:+10, alc:+5}}},
        {t:"«¿Y no era más fácil encontrarse en Huelva?»", out:{r:"Carcajada general. Juanjo intenta defenderse: «En Australia hay... perspectiva.» — «Y canguros», apunta Guille. — «Y 20.000 kilómetros de distancia de la tesorería», remata Kike, EL COMENTARIO del día. Juanjo encaja con deportividad. Tu pregunta lo desencadenó: puntúa.", fx:{resp:+7}}},
        {t:"Bostezar en mitad de la historia", out:{r:"El bostezo es interceptado en directo. «¿Le ABURRE Australia al aspirante?», pregunta Faé al público. Sentencia de Salme, sin levantar la vista del Instagram: «Al año que viene no llega.» Toca remontada.", fx:{resp:-8, ene:+4}}}
      ]}
  ]
},
/* ---------- FASE 3: LAS COPAS ---------- */
{
  name:"LAS COPAS", clock:"21:30 · Ruta de bares", pick:3, drift:{alc:+8, ene:-10, din:-15},
  tag:"Green Daila, La Casona, La Loca. El radar de Kike marca el rumbo.",
  intro:{ch:"grupo", text:"Cambio de escenario: bares. Y aquí el mando es de UNO. Kike guarda el móvil (llamada 31 del día, rechazada: esto es más importante) y activa el radar.\n\nPorque Kike SIEMPRE sabe dónde hay gente. Dónde hay ambiente. Dónde hay tías. Nadie sabe cómo lo hace: no consulta nada, no pregunta a nadie. Simplemente LO SABE.\n\n«Nos pasamos primero por el Green Daila, que a estas horas está tranquilo y se puede hablar. Luego La Casona, que hay un cumpleaños de enfermeras. Y de ahí a La Loca, que los sábados a las once explota. Y luego otra vez al Green, ya de noche.»\n\nNadie discute jamás la ruta de Kike. Green Daila de tarde, La Casona, La Loca y Green Daila de noche: ese es el circuito, ha sido siempre ese circuito, y el radar no falla.",
    opts:[
      {t:"«A la orden. El radar manda.»", out:{r:"Kike asiente satisfecho y arranca la marcha. Llegáis a La Casona y, efectivamente: cumpleaños de enfermeras. VEINTE. Te giras hacia Kike con la pregunta en la cara y él se limita a tocarse la sien: «El radar, chavea. El radar.» Pocho aprovecha el asombro para invitarte a la primera. Se acepta. Siempre se acepta.", fx:{resp:+7, alc:+9}}},
      {t:"«¿Y tú cómo sabes eso, Kike?»", out:{r:"Kike te mira largo, muy largo. «Yo lo sé todo.» No sonríe. No parpadea. Suena su móvil, lo rechaza sin mirar, y repite: «TODO.» Faé te susurra por detrás: «No preguntes. Llevamos años sin preguntar. Es mejor así.» El radar es como las llamadas: un misterio protegido.", fx:{resp:-2, alc:+8}}}
    ]},
  pool:[
    {ch:"salme", text:"Salme detecta un grupo de tres amigas en la barra. TRES. El número mágico. Pero atención, porque el maestro NO se acerca: Salme jamás entra en persona. Saca el móvil, y en cuarenta segundos de dedo prodigioso YA TIENE el Instagram de una de ellas. Sin preguntarle el nombre. Sin mirarla dos veces.\n\n«Aspirante, hoy asciendes: eres mi asesor de contenido. ¿Qué le mando primero?»",
      opts:[
        {t:"Ayudarle a elegir el primer mensaje", roll:{stat:"dig", dc:70, ok:{r:"Deliberáis como dos estrategas sobre el mapa. Descartas el «hola guapa» (amateur), descartas el fuego (quemado) y propones responder a su última story con UNA pregunta inteligente. Salme te mira despacio: «...Eso es BUENO.» Lo manda. A los cuatro minutos, las tres amigas miran hacia vuestra barra riéndose. Contacto establecido. «Asesor titular», sentencia.", fx:{resp:+13, alc:+7}}, ko:{r:"Propones un audio «que es más personal». Salme te mira como si hubieras sugerido pescar con dinamita: «¿Un AUDIO? ¿En el primer contacto? Chavea, esto es AJEDREZ.» Manda lo suyo, funciona (obviamente), y te quedas de aprendiz degradado mirando cómo trabaja el maestro. Aún te queda mucho Instagram por vivir.", fx:{resp:+3, dig:-6, alc:+7}}}},
        {t:"Observar al maestro desde la barra", out:{r:"Decides que esto hay que estudiarlo desde fuera, como un documental. Verlo operar el Instagram a esa velocidad, con ese porcentaje de acierto, sin despeinarse... es un MÁSTER. Sigues sin entender cómo lo hace. Nadie lo entiende. Kike, a tu lado, mirando también: «Llevo quince años estudiándolo. Nada.»", fx:{resp:+4, alc:+6}}},
        {t:"«¿Y si vas y le hablas en persona, Salme?»", out:{r:"Salme baja el móvil muy despacio y te mira con lástima pedagógica: «¿En PERSONA? ¿A pelo? ¿Sin señales previas?» Niega con la cabeza. «En persona se remata, chavea. Pero se entra por AQUÍ.» Golpea la pantalla dos veces. Kike asiente desde su copa: quince años de observación confirman la doctrina.", fx:{resp:-4, alc:+5}}}
      ]},
    {ch:"kike", text:"Kike y Salme comparten esquina de barra en comunión silenciosa, cada uno con su copa. Recuerdas que llevas guardado un tesoro en el móvil: el perfil de una influencer de gimnasio-y-bikini que te apareció el otro día. Contenido de máxima calidad contrastada. ¿Es el momento?",
      opts:[
        {t:"Enseñarles el perfil sin mediar palabra", out:{r:"Les plantas el móvil delante en silencio, como quien muestra un salvoconducto. La reacción es INMEDIATA y sincronizada: Kike deja la copa. Salme se inclina. «Madre. Mía.», dice uno. «¿CÓMO se llama? Pásamelo YA», dice el otro, con el dedo ya en seguir. Durante diez minutos sois tres científicos ante un descubrimiento. Acabas de encontrar el idioma común definitivo con los dos.", fx:{resp:+11, alc:+5}}},
        {t:"Dosificarlo: «Tengo algo... pero para luego»", out:{r:"El anuncio genera una expectación desmedida. Kike te mira cada diez minutos el resto de la noche articulando «¿YA?» desde lejos. Cuando por fin lo enseñas, en el momento cumbre, el efecto es DOBLE. Salme aplaude. «El chavea sabe de tempos», reconoce Kike. La dosificación: técnica de maestro.", fx:{resp:+8, alc:+6}}},
        {t:"Guardártelo, no parecer demasiado ansioso", out:{r:"Decisión conservadora y errónea: te guardas el as y la conversación muere de causas naturales. Lo que no sabes es que enseñar perfiles de influencers a Kike y a Nacho no es ansia: es DIPLOMACIA. Es su idioma oficial. Has tenido la llave del reino en el bolsillo y no la has usado.", fx:{resp:-2, alc:+5}}}
      ]},
    {ch:"amigo", text:"Pocho guarda el móvil y anuncia, con la naturalidad de quien comenta el tiempo:\n\n«Ah, por cierto. Que se viene un amigo mío.»\n\nSilencio. Los chaveas se miran entre ellos. Nadie pregunta quién es, porque saben que no van a reconocer el nombre. Ni lo van a llegar a saber, de hecho: es una tradición no escrita que los amigos de Pocho no se presentan nunca formalmente y que al final de la noche nadie sabe cómo se llaman.\n\n«¿Y quién es?», preguntas tú, que eres nuevo.\n\nPocho sonríe: «Un personaje. De novela de ficción, chavea. De NOVELA DE FICCIÓN.»\n\nY veinte minutos después aparece. {AD}",
      opts:[
        {t:"Presentarte y darle conversación de verdad", out:{r:"Te lanzas. Y en cuarenta minutos te ha contado tres historias imposibles de verificar, te ha ofrecido un negocio y te ha explicado una teoría propia sobre el sueño. En ningún momento os habéis dicho vuestros nombres y a ninguno de los dos le ha parecido raro.\n\nAl rato miras alrededor: está integrado. Guille lo abraza. Faé le pide su opinión sobre algo. Ya nadie recuerda que hace una hora no existía. Pocho te guiña un ojo: «¿Ves? Personaje.»", fx:{resp:+10, alc:+7}}},
        {t:"«Pocho, ¿de dónde sacas a esta gente?»", out:{r:"Pocho se lo piensa de verdad, con la copa a media altura. «No lo sé, chavea. Aparecen.» Pausa. «Yo creo que me buscan ellos.»\n\nY es la explicación más razonable que existe: hay un imán en este hombre que atrae personajes de novela de ficción y los deposita en los Chavea Days. Lleva quince años pasando. El grupo ya lo da por hecho meteorológico.", fx:{resp:+7, alc:+6}}},
        {t:"Preguntarle cómo se llama", out:{r:"Se lo preguntas. Y en ese instante, exactamente en ese instante, el tío se gira porque Faé le está gritando algo desde la otra punta del bar, contesta a Faé, vuelve, y retoma la conversación por otro sitio completamente distinto.\n\nNo te ha contestado. No lo ha hecho a propósito. Simplemente es así como funciona esto, y a lo largo de la noche lo intentarás dos veces más con el mismo resultado.", fx:{resp:+4, alc:+5}}}
      ]},
    {ch:"pocho", text:"En La Loca hay cola en la barra. Cuatro filas de gente, camareros desbordados, imposible pedir. Los chaveas se resignan a esperar.\n\nPocho desaparece.\n\nTres minutos después vuelve con cuatro copas, un chupito de cortesía y —no se sabe cómo— la simpatía personal del camarero, que ahora le atenderá de aquí al final de la noche por encima de todo el mundo. Nadie le ha visto hacer cola. Nadie le ve nunca hacer cola.\n\nTe pasa una copa: «La tuya. Y toma, guárdame esto», y te deja el chupito en la mano.",
      opts:[
        {t:"Preguntarle cómo consigue esto siempre", out:{r:"«Se llega antes, se pide bien y se da las gracias», dice como si fuera obvio. «Y a la tercera vez que vienes, el camarero ya sabe cómo te llamas.»\n\nEs la revelación más aburrida y más útil de la noche: el arte de Pocho no es magia, es CONSTANCIA. Salme, que escucha a medias, no lo entiende. Kike sí. El Turko asiente lentamente.", fx:{resp:+9, alc:+8}}},
        {t:"Aprender: ir tú a por la siguiente ronda a su lado", out:{r:"Te pegas a él como aprendiz y observas la técnica: contacto visual, pedido claro y corto, propina discreta, nombre del camarero. Vuelves con seis copas y sin haber esperado.\n\nPocho te da dos palmadas en la espalda: «Ya tienes oficio, chavea.» Es el único título que reparte y lo acabas de sacar.", fx:{resp:+13, din:-18, alc:+8}}},
        {t:"Bebértelo todo y dejar que él se ocupe", out:{r:"Aceptas la copa, aceptas el chupito «guardado» (que te bebes en cuanto se gira) y te dejas atender como un señorito toda la noche.\n\nFunciona. Bebes gratis. Pero cuando Pocho pasa por décima vez con copas para todos y tú sigues sentado, el Turko lo comenta en voz baja: «El chavea se está acostumbrando.» Y eso, dicho por el Turko, es un aviso.", fx:{resp:-6, alc:+13}}}
      ]},
    {ch:"fae", text:"CATÁSTROFE ANUNCIADA: Faé ha encontrado un bazar abierto y ha salido con una TROMPETA DE JUGUETE. La historia se repite, como en aquella discoteca. La está tocando ya por la calle, mal y fuerte. De pronto te la ofrece: «Toca, aspirante. TOCA.»",
      opts:[
        {t:"Tocar la trompeta por todo el bar", out:{r:"Le das al pistón sin complejos: PRAAAAA. El bar se gira. Faé llora de emoción: «¡TIENE EL DON!» Os turnáis la trompeta el resto de la noche como un estandarte de guerra. El camarero os odia. El grupo te adora. Balance positivo.", fx:{resp:+11, dig:-8, alc:+5}}},
        {t:"«El artista eres tú, Faé. Yo soy tu público.»", out:{r:"Jugada maestra: alimentar al artista. Faé, henchido, se sube al altavoz apagado y da un concierto de tres minutos que quedará en los anales. Tú aplaudes desde abajo. Él triunfa, tú conservas la dignidad, y además te señala: «¡Mi representante!»", fx:{resp:+7, alc:+5}}},
        {t:"Esconderle la trompeta cuando se despiste", roll:{stat:"dig", dc:78, ok:{r:"Operación quirúrgica: la trompeta desaparece dentro de una maceta (las macetas están siendo tus grandes aliadas hoy). Faé la busca desconsolado un rato y luego se le olvida. El camarero, que lo ha visto todo, te trae un chupito de gratitud: «Invita la casa, héroe.»", fx:{resp:+4, alc:+8}}, ko:{r:"Te pilla EN EL ACTO, con la mano en la maceta. «¿TÚ?» El drama es shakespeariano: te señala ante el grupo entero como el Judas de la trompeta. Tu condena: tocarla tú el resto de la noche CADA VEZ que Faé lo ordene. Y lo ordenará.", fx:{resp:-6, dig:-9}}}}
      ]},
    {ch:"guille", text:"En La Loca, Guille lleva dos copas por encima del umbral y ha entrado en la fase intermedia: la fase de las TEORÍAS.\n\nTe ha llevado a un rincón, ha apartado dos taburetes para tener espacio y está usando una servilleta, un mechero y tu vaso para demostrarte algo. La explicación es apasionada, técnicamente rigurosa en un 60% y completamente incomprensible en el resto.\n\n«¿Lo VES? ¿Ves por qué esh imposible?»\n\nNo ves nada. El mechero se ha caído dos veces.",
      opts:[
        {t:"Decirle que sí lo ves y pedirle que siga", out:{r:"«¡GRASHIAS!», grita. «¡NADIE me deja terminar NUNCA!»\n\nY termina. Once minutos. Y lo asombroso es que el final tiene sentido: llegas a entender de verdad lo que te estaba explicando y hasta le haces una pregunta buena, que él contesta con una precisión sorprendente para su estado.\n\nEl ingeniero está ahí dentro, entero. Solo hay que tener la paciencia de esperarle.", fx:{resp:+11, ene:-6}}},
        {t:"Reordenarle los objetos y explicárselo tú", out:{r:"Coges la servilleta, el mechero y el vaso, los colocas bien y le devuelves su propia teoría ordenada.\n\nGuille se queda mirando la mesa en silencio absoluto. Luego te mira. Luego la mesa otra vez.\n\n«...Esho es exactamente lo que quería decir.» Y te da un abrazo tan intenso que tira el vaso y destruye el modelo. Ha valido la pena.", fx:{resp:+12, ene:-5, din:-4}}},
        {t:"«Guille, luego me lo cuentas, que estamos de fiesta.»", out:{r:"Error de cálculo. Interrumpir una teoría de Guille a mitad no la cancela: la POSPONE, y mientras está pospuesta se acumula presión.\n\nDos horas más tarde, en plena discoteca, con la música a tope, te agarrará por los hombros para retomarla exactamente donde la dejó. Y ahí ya no habrá servilleta ni mechero, solo gritos.", fx:{resp:-4, alc:+6}}}
      ]},
    {ch:"turko", text:"Salís a la puerta de La Casona y el Turko enciende uno. Lleva ocho horas de Chavea Day y sigue exactamente igual que a las dos de la tarde: misma sonrisa, mismo ritmo, misma paz.\n\nDe pronto pregunta, sin dramatismo ninguno: «Chavea, ¿tú sabes por qué yo aguanto?»\n\nY antes de que contestes, se responde solo:\n\n«Porque a mí esto no me altera. A vosotros os SUBE. A mí me pone... a nivel.»",
      opts:[
        {t:"«¿A nivel de qué?»", out:{r:"«A nivel», repite, como si eso lo explicara todo. Y en su caso lo explica.\n\nDurante los siguientes veinte minutos te da la clase magistral definitiva del Chavea Day: no hay que llegar arriba, hay que llegar LEJOS. El que sube rápido baja rápido. El que se pone a nivel dura veinte horas.\n\nEs sabiduría barata de puerta de bar y a la vez es rigurosamente cierta: él es la prueba viviente.", fx:{resp:+10}}},
        {t:"«Yo creo que aguantas porque eres un fenómeno.»", out:{r:"El Turko se ríe con la boca cerrada, sin negarlo, que es su forma de aceptar un cumplido.\n\n«Bueno. Práctica también.» Da una calada. «Mucha práctica.»\n\nY ahí está la clave: no es genética, es OFICIO. Décadas de oficio. El grupo lleva media vida creyendo que el Turko tiene un don y resulta que lo que tiene son horas de vuelo.", fx:{resp:+8}}},
        {t:"Contarle que a ti ya te está costando", roll:{stat:"dig", dc:55, ok:{r:"Le confiesas la verdad: que llevas ocho horas, que la cabeza te va a otro ritmo y que no sabes si vas a llegar.\n\nEl Turko asiente sin juzgar, tira el cigarro y dice: «Pues vamos a arreglarlo.» Te trae un vaso de agua, te hace fumar despacio y te tiene diez minutos en la puerta hablando de nada.\n\nCuando volvéis dentro estás nuevo. Nadie más se habría dado cuenta, y nadie más lo habría arreglado sin decírselo a los demás.", fx:{resp:+9, ene:+14, alc:-8}}, ko:{r:"Intentas confesarlo pero te sale como una bravata: «Bueno, yo estoy PERFECTAMENTE, mejor que nadie.»\n\nEl Turko te mira un segundo de más. No dice nada. Y ese segundo de más es la evaluación completa: sabe exactamente cómo estás, sabe que has mentido y sabe que no ibas a admitirlo.\n\n«Ya. Pues nada.» Y vuelve dentro. Has perdido la única ayuda que se ofrecía gratis.", fx:{resp:-5, ene:-5}}}}
      ]},
    {ch:"pocho", text:"En un aparte de barra, Pocho se te acerca con esa sonrisa suya de estar más cariñoso de la cuenta. Baja la voz: «Chavea... ¿tú confías en mí?» Se toca el bolsillo mágico de la chaqueta. Las legendarias «trampas» de Pocho, de las que hablan las crónicas. No pregunta dos veces.",
      opts:[
        {t:"«Confío, pero hoy paso. Respeto, mediocentro.»", out:{r:"Pocho asiente despacio y te da una palmada: «RESPUESTA CORRECTA. Las trampas no se ofrecen, se ganan. Y no se aceptan a la primera. Hay que saber decir que no... para que el sí valga algo.» Te acaba de dar una clase de filosofía pochista y además has aprobado sin saberlo.", fx:{resp:+10}}},
        {t:"«¿Qué llevas exactamente ahí, Pocho?»", out:{r:"Error de protocolo GRAVE. Pocho se cierra la chaqueta con gesto ofendido: «Las trampas NO SE PREGUNTAN, chavea. Las trampas SE CONFÍAN.» Se aleja hacia Alberto de la Puente, que jamás pregunta nada. Has perdido puntos con el mediocentro, y eso se nota en todo el equipo.", fx:{resp:-7}}},
        {t:"Asentir en silencio como los veteranos", out:{r:"Un asentimiento lento, sin palabras. Pocho lo interpreta como sabiduría y decide que la conversación ha ido perfectamente aunque no haya pasado nada, que es exactamente como funcionan las mejores conversaciones con Pocho a estas horas. Te invita a la siguiente copa.", fx:{resp:+6, alc:+9}}}
      ]},
    {ch:"puente", text:"La puerta del bar se abre de golpe y entra ALBERTO DE LA PUENTE con los brazos ya abiertos, antes incluso de haber identificado a nadie. Empieza la ronda de abrazos: abraza a Juanjo, abraza al Turko, abraza a Guille, abraza a Faé, abraza a un señor de la barra que no conoce de nada y que se deja.\n\nEntonces localiza a Salme y la discoteca entera lo oye:\n\n«¡¡NASHOOOOOOO!!»\n\nY acto seguido, en cuanto ve a Pocho, cambia de registro a un canturreo hipnótico mientras le agarra la cara con las dos manos:\n\n«Pochín pochín pochín pochín...»\n\nY entonces te ve a ti. Aspirante desconocido. Brazos abiertos. Viene.",
      opts:[
        {t:"Abrirte de brazos y recibir el abrazo entero", out:{r:"Te levanta del suelo. Literalmente. Un hombre que ha corrido 15 km esta mañana «para hacer hueco» tiene una fuerza que no es de este mundo. «¡EL NUEVO! ¡EL NUEVOOO!», ruge, y automáticamente te bautiza con un diminutivo: a partir de ahora eres «chaveíta chaveíta chaveíta» y responderás a ello el resto de tu vida. Ser nombrado por De la Puente es un sacramento.", fx:{resp:+12, ene:-5, alc:+10}}},
        {t:"Devolvérsela: «¡¡PUENTEEEE!!» a pleno pulmón", out:{r:"Le gritas TÚ primero, con el mismo volumen y la misma vocal alargada. Alberto frena en seco, procesa un segundo... y estalla: «¡¡ESTE CHAVEA ES DE LOS NUESTROS!!» Te abraza el doble de fuerte y le anuncia al bar entero que hoy invitas tú, cosa que no has dicho. Pero el respeto ganado compensa las rondas.", fx:{resp:+14, alc:+14, din:-15}}},
        {t:"Tenderle la mano para saludar formalmente", out:{r:"Le tiendes la mano. Alberto la mira. Mira la mano. Mira al grupo. Mira otra vez la mano. Y luego te abraza IGUAL, ignorando la mano por completo, mientras Faé narra la escena: «¡Le ha ofrecido la MANO! ¡A DE LA PUENTE!» Aprendes la lección más rápida del día: a este hombre no se le da la mano. A este hombre se le abraza.", fx:{resp:-3, alc:+9}}}
      ]},
    {ch:"kike", text:"Kike, recuperado el habla tras su bache de la sobremesa (nadie sabe cómo, se sospecha que la llamada 23 lo reinició), te enseña el móvil con orgullo: fotos del Land Rover. Luego la moto. Luego «el otro coche».\n\n«¿Tú qué llevas?», te pregunta. La pregunta trampa definitiva del típico tío tío.",
      opts:[
        {t:"«Un utilitario... pero con historias.»", out:{r:"«Las historias son lo que importa», concede Kike con solemnidad de concesionario filosófico, y te enseña 14 fotos más del Land Rover en distintos ángulos y barros. Apruebas la prueba del motor por humildad bien plantada.", fx:{resp:+6}}},
        {t:"«¿Y para qué quiere alguien TRES vehículos?»", out:{r:"Kike te mira como si le hubieras preguntado para qué quiere alguien tres amigos. «No es cuestión de PARA QUÉ, es cuestión de POR QUÉ NO.» La mesa entera asiente. Acabas de recibir una lección de economía chavea de un hombre que gestiona zonas ORA. Reflexiona.", fx:{resp:-3, alc:+5}}},
        {t:"«¿Me llevas un día en el Land Rover?»", out:{r:"Has tocado LA tecla. A Kike se le ilumina la cara: «¿El sábado te viene bien?» Te enseña rutas, barrizales, un vídeo del coche saliendo de un río. Tenéis un plan cerrado antes del siguiente trago. Los chaveas observan: el aspirante ya hace planes por separado con miembros del grupo. Muy buena señal.", fx:{resp:+9}}}
      ]},
    {ch:"salme", text:"Salme se te acerca con la copa en una mano y el móvil en la otra, y te lanza LA pregunta. La pregunta que le hace a todo aspirante, a todo recién llegado, a todo desconocido que se cruza en su camino desde aproximadamente 2009:\n\n«Oye, chavea... ¿tú no conocerás un grupito de tías bueno?»\n\nNo es una pregunta. Es un censo. Salme lleva media vida haciendo este trabajo de campo con la constancia de un funcionario.",
      opts:[
        {t:"«Pues mira, igual sí. Déjame que escriba.»", out:{r:"Salme deja la copa. LA COPA. Se sienta a tu lado con la atención de un inversor ante un unicornio. «Cuéntame. Cuántas. De dónde. ¿Salen hoy?» Escribes a un grupo cualquiera para no defraudarle y él supervisa la redacción del mensaje palabra por palabra. Vengan o no, ya te has ganado el puesto de proveedor oficial. Kike, celoso: «A mí nunca me lo pregunta con tanto interés.»", fx:{resp:+12, alc:+5}}},
        {t:"«¿Un grupito? Salme, si tú conoces a media ciudad.»", out:{r:"«Conocer conozco», admite con la humildad del profesional, «pero yo lo que busco es un grupito NUEVO. Fresco. Sin historial.» Lo dice como un ojeador de fútbol hablando de canteras. Es a la vez lo más ridículo y lo más admirable que has oído hoy. Le invitas a una copa por la dedicación.", fx:{resp:+6, alc:+6, din:-8}}},
        {t:"«No conozco a nadie, tío. Lo siento.»", out:{r:"Salme asiente sin inmutarse, ya mirando por encima de tu hombro hacia el siguiente sujeto del censo. «Tranquilo. Pregunto a todo el mundo.» Y se va. Literalmente a los diez segundos oyes, a tres metros: «Oye, ¿tú no conocerás un grupito de tías bueno?» Es implacable. Es admirable. Y has perdido tu turno.", fx:{resp:-2, alc:+5}}}
      ]},
    {ch:"fae", text:"Faé se ha subido a algo. Nunca se sabe a qué, pero siempre hay algo a lo que subirse. Y ha decidido que este grupo necesita un HIMNO. Ahora mismo. Se lo está inventando EN DIRECTO, sobre la marcha, con una métrica dudosa y una convicción absoluta:\n\n«¡QUE-SE-BE-BAAA! ¡QUE-SE-BE-BAAA! ¡EL-QUE-NO-BE-BA-ES-UN... UN...»\n\nSe queda en blanco. Necesita la rima. Te mira. TE MIRA A TI. El bar entero espera.",
      opts:[
        {t:"Rematar la rima gritando lo primero que se te ocurra", roll:{stat:"dig", dc:60, ok:{r:"«¡...UN CANTAMAÑANAS!» Faé se queda mudo medio segundo y explota: «¡¡CANTAMAÑANAS!! ¡¡ESO!!» El bar entero corea tu palabra durante cuatro minutos seguidos. A partir de esta noche, «cantamañanas» es un insulto oficial del grupo y se usará durante años. HAS APORTADO VOCABULARIO. Eso es inmortalidad chavea.", fx:{resp:+15, dig:-5, alc:+6}}, ko:{r:"«¡...UN MALA PERSONA!» No rima. No escande. No funciona. Faé te mira con dolor artístico genuino: «Chavea... eso no rima con NADA.» Improvisa él («¡...UN PENDONGO SIN ALMA!») y se lleva la ovación. Lo tuyo queda como el borrador descartado de un himno. Aún así, participaste.", fx:{resp:+4, dig:-7, alc:+6}}}},
        {t:"Hacerle los coros y la percusión con la barra", out:{r:"Golpeas la barra marcando el compás mientras Faé improvisa cinco estrofas más, cada una con un insulto nuevo inventado sobre la marcha («¡chorlito de bar!», «¡mediotrago!», «¡copichuela!»). El camarero os pide que paréis y luego se une. Faé te nombra su sección rítmica oficial.", fx:{resp:+10, dig:-4, alc:+5}}},
        {t:"Grabarlo todo en vídeo para el grupo", out:{r:"Documentas el nacimiento del himno en 4K vertical. El vídeo circulará por el grupo durante meses y será citado en cada Chavea Day futuro. Faé, al verlo al día siguiente, no recordará haberlo compuesto y preguntará: «¿Quién ha escrito esto? Es BUENÍSIMO.» Eres el archivero de la mitología. Trabajo silencioso pero eterno.", fx:{resp:+7, alc:+5}}}
      ]},
    {ch:"turko", text:"El Turko lleva la misma sonrisa serena desde las 14:00. Ha bebido lo mismo que todos y ha hecho cuatro visitas a «fachadas» de interés arquitectónico variable, pero ahí está: impecable, ecuánime, eterno. Te apoya el codo en el hombro: «¿Sabes cuál es el secreto, chavea?»",
      opts:[
        {t:"«¿Cuál es el secreto, Turko?»", out:{r:"«El equilibrio.» Da una calada lenta. «Todo en su medida. Todo a su ritmo. Yo nunca voy mal... voy RELATIVAMENTE bien. La relatividad, chavea. Einstein iba de esto.» Es la mayor mentira estructural jamás construida por un arquitecto, y sin embargo, en él, es VERDAD. Asientes con reverencia.", fx:{resp:+8}}},
        {t:"«El secreto es que tú estás hecho de otra pasta.»", out:{r:"El Turko sonríe y no lo niega, porque es empíricamente cierto: décadas de observación científica del grupo lo confirman. «Cuando todos caigáis», dice sin dramatismo, «yo apagaré la luz.» Y sabes, con certeza absoluta, que así será. Siempre ha sido así.", fx:{resp:+6}}},
        {t:"Intentar seguir SU ritmo exacto de consumo", roll:{stat:"alc", dc:85, ok:{r:"Durante una hora completa replicas el protocolo Turko: mismo trago, misma pausa, misma serenidad. Y funciona. FUNCIONA. Te sientes ecuánime, eterno, arquitectónico. El Turko te observa de reojo: «Interesante, chavea. Interesante.» Es lo más parecido a un doctorado que da este grupo.", fx:{resp:+12, alc:+8}}, ko:{r:"Craso error conceptual: el ritmo del Turko no es una técnica, es una CONDICIÓN GENÉTICA. A los cuarenta minutos de imitarlo, el suelo empieza a tener opiniones propias. El Turko te sujeta con una mano sin dejar de fumar con la otra: «El equilibrio no se copia, chavea. Se nace.»", fx:{alc:+18, dig:-6, resp:+3}}}}
      ]}
  ]
},
/* ---------- FASE 4: LA DISCOTECA ---------- */
{
  name:"GREEN DAILA", clock:"00:30 · Zona de cortinas", pick:3, drift:{alc:+8, ene:-12, din:-15},
  tag:"Vuelta al Green, pero de noche. Luces, cortinas (peligro histórico) y el grupo en su máximo esplendor.",
  intro:{ch:"grupo", text:"Segunda visita al Green Daila del día, y no se parece en nada a la de la tarde. Ahora hay luces, hay cola y hay volumen. Entráis en formación de cuña, Faé en la punta como mascarón de proa, saludando al segurata como si lo conociera (probablemente lo conoce).\n\nDentro: reservado conseguido por Salme mediante artes desconocidas, Pocho ya de camino a la barra sin que nadie le haya pedido nada, y —lo ves y se te hiela la sangre— CORTINAS. Cortinas rojas, largas, elegantes. El historial de este grupo con las cortinas de discoteca es literalmente lo peor que existe.",
    opts:[
      {t:"Entrar a la pista con todo", out:{r:"Te entregas. Los chaveas te rodean en círculo en algún momento indeterminado y te ves bailando en el centro sin saber cómo has llegado ahí. Es un bautismo. Todo grupo tiene sus liturgias y acabas de pasar una.", fx:{resp:+8, ene:-10, alc:+6}}},
      {t:"Asegurar el reservado y las copas primero", out:{r:"Mentalidad logística: alguien tiene que custodiar las copas, y ese alguien gana siempre el respeto silencioso del grupo. Pocho te deja al mando del reservado con un gesto: acabas de ser nombrado intendente. Es un honor discreto pero real.", fx:{resp:+5, din:-10, alc:+7}}}
    ]},
  pool:[
    {ch:"juanjo", text:"ALERTA MÁXIMA. Juanjo lleva un rato callado con la mirada perdida y los carrillos en posición de precarga. Ha bebido vino en la comida. VINO. Las condiciones son EXACTAMENTE las de la histórica noche de las cortinas rojas. Y está... se está acercando a las cortinas. La historia llama a la puerta.",
      opts:[
        {t:"Interceptarlo y redirigirlo al baño con urgencia", roll:{stat:"ene", dc:65, ok:{r:"Sprint heroico entre la multitud. Lo alcanzas, lo giras con suavidad de estibador experto y lo escoltas al baño, donde la historia transcurre por el cauce oficial. Al salir, Juanjo te mira con los ojos húmedos del superviviente: «Las cortinas... estaban ahí... y tú me salvaste.» Los chaveas lo han visto TODO. Ovación.", fx:{resp:+15, ene:-8}}, ko:{r:"Llegas medio segundo tarde. MEDIO SEGUNDO. La historia se repite con una fidelidad escalofriante: mismo color, misma cortina, mismo arco balístico. El grupo entero contempla el momento en silencio reverencial, como quien ve un cometa que pasa cada 15 años. Evacuación de emergencia del local. Otra vez.", fx:{resp:+6, dig:-5, ene:-10}}}},
        {t:"Ofrecerle un cigarro para distraer al ácido", out:{r:"Jugada de veterano: el cigarro es el único protocolo homologado contra el pre-ácido. Juanjo lo acepta por puro acto reflejo y el sistema se estabiliza en la puerta, lejos del textil. «Controlado», informa después a la mesa, como un parte médico. Los que sabían del riesgo te miran con respeto nuevo.", fx:{resp:+10}}},
        {t:"Dejar que el destino escriba su segunda parte", out:{r:"Decides no intervenir en los asuntos de los dioses. Y los dioses, esta vez, son clementes: Juanjo se detiene a un metro de las cortinas, traga con la épica silenciosa de siempre, y vuelve a la barra como si nada. Te has librado. Pero Pocho te vio verlo y no hacer nada, y esa mirada te la llevas puesta.", fx:{resp:-4, alc:+5}}}
      ]},
    {ch:"fae", text:"Localizas a Faé en la penumbra con una postura corporal inconfundible, orientado hacia... no. NO. Hacia las cortinas del fondo. El OTRO episodio histórico de cortinas del grupo. Por esto exactamente os echaron de aquella discoteca. Está desabrochándose... tienes tres segundos.",
      opts:[
        {t:"Placaje suave y desvío hacia los baños", out:{r:"Llegas en DOS segundos. Brazo por encima, giro de 90 grados, «por aquí, artista», y Faé se deja llevar entre risas hasta el baño, donde mear es legal y hasta recomendable. Acabas de salvar la noche entera del grupo, porque una segunda expulsión por cortinas habría sido demasiado historial ya. Pocho te declara oficialmente «útil».", fx:{resp:+13, ene:-5}}},
        {t:"Hacer de vigía mientras la historia se repite", roll:{stat:"dig", dc:75, ok:{r:"Contra todo pronóstico, tu labor de contravigilancia funciona: bloqueas la línea de visión del segurata con una coreografía improvisada de baile-pantalla. Faé completa su obra. Nadie ve nada. Es lo peor que has hecho en tu vida y también, según los estándares de este grupo, lo más noble. «Cómplice de leyenda», te susurra.", fx:{resp:+9, dig:-10}}, ko:{r:"El segurata os pilla A LOS DOS: al autor y a su cómplice-pantalla, que resulta ser el delito más ridículo de encubrir del mundo. Expulsión inmediata de ambos. Esperáis al grupo en la puerta como dos colegiales castigados. Cuando salen y se enteran, el respeto sube por la nobleza y baja por la ejecución. Empate técnico tirando a caro.", fx:{resp:+3, dig:-12, din:-10}}}},
        {t:"Avisar al segurata para prevenir males mayores", out:{r:"TRAICIÓN. Puede que hayas salvado las cortinas, pero has roto el código: los asuntos del grupo se gestionan DENTRO del grupo. Faé es interceptado por el segurata y te localiza con el dedo desde lejos: «¡TÚ!» El grupo entero se entera en 90 segundos. Esta te va a costar remontarla.", fx:{resp:-13, dig:+3}}}
      ]},
    {ch:"guille", text:"El Loko ha alcanzado su forma final. Está en medio de la pista, camisa medio fuera, manteniendo una conversación intensísima con... compruebas dos veces... sí, con una columna. De pronto te localiza. Cruza la pista hacia ti con una expresión indescifrable entre el cariño infinito y el juicio final. Es 50/50. Siempre es 50/50.",
      opts:[
        {t:"Abrir los brazos y aceptar tu destino", out:{r:"La moneda cae del lado bueno: ABRAZO. Un abrazo desmedido, estructural, con levantamiento de suelo incluido, mientras te grita al oído algo hermosísimo sobre los cohetes y la amistad, con un 30% de consonantes. Los chaveas os hacen fotos. Es el momento más peligroso y más bonito de la noche a la vez.", fx:{resp:+11, ene:-8}}},
        {t:"Chocarle el puño para mantener distancia", roll:{stat:"dig", dc:70, ok:{r:"El puño funciona: Guille lo choca, lo convierte en una coreografía inventada de siete pasos que os sale accidentalmente PERFECTA, y la pista os hace corro. Habéis creado algo. Nadie sabe qué, pero algo. El Loko te corona: «Mi hermano de baile.»", fx:{resp:+9, ene:-5}}, ko:{r:"El puño en fase Loko-avanzada es interpretado como DESAFÍO. «¿Me eshtás vacilando?» Escalada instantánea. Se activa el protocolo de emergencia: Pocho por la izquierda con un chupito, el Turko por la derecha con parsimonia, y el sistema se desactiva por saturación. «Al Loko nunca un puño, SIEMPRE abrazo», te instruyen después. Lección grabada a fuego.", fx:{resp:-5, dig:-5, ene:-6}}}},
        {t:"Señalar hacia otro lado gritando «¡GUILLE, MIRA!»", out:{r:"La maniobra del perro con la pelota. Y FUNCIONA: Guille se gira, encuentra a Alberto Hernández, y redirige toda su energía hacia él, que lo recibe encantado. Has esquivado al Loko con ingeniería social pura. El Turko lo ha visto y te dedica una calada de respeto: «Elegante.»", fx:{resp:+5}}}
      ]},
    {ch:"grupo", text:"Faé saca del bolsillo un bulto de tela doblado. LA BANDERA. La bandera de los chaveas, la que se regaló el año de la camiseta, la que preside cada Chavea Day desde entonces colgada donde se pueda: barandillas, respaldos, una vez el capó de un coche patrulla (asunto cerrado y no comentado).\n\nLa despliega en mitad de la discoteca y busca sitio con la mirada. Localiza el objetivo: la barandilla del reservado VIP, dos metros por encima de la zona acordonada.\n\n«Chavea. Tú eres el que menos ha bebido de los que quedan. TE TOCA.»",
      opts:[
        {t:"Escalar y colgar la bandera en el VIP", roll:{stat:"ene", dc:78, ok:{r:"Te encaramas a la barandilla con una agilidad que ni tú te esperabas, atas la bandera con dos nudos que Salme (capitán náutico) aprueba a gritos desde abajo, y saltas.\n\nLa bandera de los chaveas ondea sobre el VIP de la discoteca. Guille llora. Faé toca el silbato nuevo. Los de la zona VIP, sin entender nada, hacen fotos. Ha entrado en el histórico y estabas TÚ arriba.", fx:{resp:+15, ene:-12, dig:-4}}, ko:{r:"Subes, atas la bandera... y el nudo se deshace en cuanto sueltas. La bandera cae en toda la cara de un tipo del VIP, que se levanta ofendidísimo. Segundos de tensión diplomática hasta que ve el escudo, pregunta qué es, y Faé le suelta una explicación de siete minutos tras la cual el tipo quiere UNA CAMISETA.\n\nCaos gestionado. La bandera acaba colgada. Tú acabas con el codo pelado.", fx:{resp:+7, ene:-15, dig:-8}}}},
        {t:"Colgarla en sitio seguro pero visible", out:{r:"Aplicas criterio: nada de VIP, nada de escaladas. La atas en la barandilla de la escalera principal, por donde pasa TODO el mundo. Visibilidad máxima, riesgo cero.\n\nFaé protesta («¡sin épica!») pero Pocho te respalda: «La bandera tiene que estar colgada AL FINAL de la noche, no arrancada a los diez minutos. El chavea ha pensado.» Y así fue: aguantó hasta el cierre.", fx:{resp:+9, ene:-4}}},
        {t:"«¿Lleváis la bandera SIEMPRE encima?»", out:{r:"Los tres que están cerca te miran como si hubieras preguntado si respiran. «Hombre.» Y ya está. Esa es toda la respuesta que vas a obtener.\n\nFaé se la cuelga él mismo, de cualquier manera, y se cae a los cuatro minutos. Podría haber sido tu momento. La has dejado pasar por preguntar lo obvio.", fx:{resp:-3, alc:+5}}}
      ]},
    {ch:"hdez", text:"Se abre un corro en la pista. En el centro, Alberto Hernández se quita la chaqueta con parsimonia ceremonial, la entrega a un desconocido, y ejecuta LA VOLTERETA: aquella perfección técnica aprendida en el karate de su infancia, rotación completa, recepción limpia, los brazos en V. La discoteca ESTALLA.\n\nY entonces te señala: «AHORA EL NUEVO.»",
      opts:[
        {t:"Intentar la voltereta", roll:{stat:"ene", dc:80, ok:{r:"Te santiguas, coges aire, y la ejecutas: rotación no perfecta pero SÍ COMPLETA, recepción con un solo tambaleo. El corro ruge tu nombre sin conocer tu nombre («¡EL NUEVO! ¡EL NUEVO!»). Hernández te abraza: «¡Karate espiritual!» Esta noche ya es tuya.", fx:{resp:+15, ene:-12}}, ko:{r:"La física es implacable con los valientes: rotas 270 de los 360 grados necesarios y aterrizas de espaldas con un impacto que se oye POR ENCIMA de la música. El corro hace «OOOOH». Te levantan entre cuatro. «La intención ha sido de 10», dictamina Hernández. El vídeo ya circula por el grupo. Duele todo, pero puntúa.", fx:{resp:+7, dig:-12, ene:-15}}}},
        {t:"Responder con tu propio movimiento estrella", out:{r:"No compites con la voltereta: OFRECES OTRA COSA. Tu movimiento (una mezcla de robot y flamenco que no sabías que tenías dentro) descoloca al público lo justo para triunfar por sorpresa. Hernández te choca la mano: la pista se reparte en dos escuelas artísticas. Empate de leyendas.", fx:{resp:+9, ene:-8, dig:-3}}},
        {t:"Declinar con una reverencia al maestro", out:{r:"Reverencia solemne, gesto de «no soy digno». Hernández la acepta con la nobleza del karateca: «El nuevo sabe RECONOCER.» Sales del corro intacto. Puntúa poco, pero puntúa, y tu columna vertebral te lo agradece en silencio.", fx:{resp:+3}}}
      ]},
    {ch:"salme", text:"Fenómeno paranormal en curso. Salme lleva 40 minutos sin apenas hablar con nadie —solo Instagram, copa, Instagram— y de pronto aparece EN EL RESERVADO... con las tres amigas detrás. No se va con ellas. NUNCA se va con ellas. Las TRAE.\n\n«Chaveas, estas son Marta, Ana y no me acuerdo. Se vienen con nosotros.»\n\nY se sienta. Y ya está. Y ellas se quedan, encantadas, integradas en el grupo como si llevaran diez años viniendo al Chavea Day.\n\nKike lo observa con la boca literalmente abierta. «Pero... si no ha HABLADO con ellas. Yo lo he estado mirando. NO HA HABLADO CON ELLAS.»",
      opts:[
        {t:"Ayudar a integrarlas: presentarles al grupo entero", out:{r:"Te pones en modo anfitrión y haces las presentaciones oficiales: «Este es Juanjo, no le habléis si hincha los carrillos. Este el Turko, va relativamente bien. A ese de ahí abrazadle, no le deis la mano.» Las tres se parten de risa y se quedan hasta el final. Salme te señala con la copa: «El chavea ha entendido el JUEGO. No es llevárselas. Es que se QUEDEN.»", fx:{resp:+12, alc:+5}}},
        {t:"Preguntarle a Kike si sigue vivo", out:{r:"Kike no reacciona. Sigue mirando a Salme como quien ve levitar a alguien. «Quince años», murmura. «Quince años estudiando y todavía no he visto la TRANSICIÓN. ¿En qué momento pasan de estar allí a estar AQUÍ?» Le pones una mano en el hombro. No hay consuelo posible. Es el misterio de su vida.", fx:{resp:+7, alc:+6}}},
        {t:"«Salme, tío, ¿cómo lo has hecho?»", out:{r:"Salme se encoge de hombros con sinceridad devastadora: «No lo sé.» Y lo peor es que es VERDAD. No lo sabe. Nunca lo ha sabido. El grupo lleva años esperando una metodología y resulta que no hay metodología, hay un DON. Pocho sentencia: «Es como preguntarle al rayo por qué cae donde cae.»", fx:{resp:+3, alc:+5}}}
      ]},
    {ch:"pocho", text:"Pocho te agarra del brazo y te saca a la calle sin preguntar. «Vamos a tomar el aire un momento, chavea. Que me está subiendo el asunto.»\n\nFuera, apoyado en la pared, respira hondo tres veces. Y aquí puede pasar cualquiera de las dos cosas, porque el asunto tiene dos caras y nunca se sabe cuál toca.\n\nHoy toca esta: se gira, te abraza con las dos manos en los hombros y te suelta mirándote muy fijo a los ojos:\n\n«Oye. En serio. Qué guay que hayas venido hoy. QUÉ GUAY. Lo digo de verdad, eh. De verdad de la buena.»\n\nEstá en el pico. Es el Pocho más sincero del año y solo dura unos minutos.",
      opts:[
